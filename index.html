<title>About Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap">
<style>
/* ── Tokens ─────────────────────────────────────────────── */
:root {
  --bg:      #FFFFFF;
  --ink:     #0B0B0C;   /* headline black */
  --muted:   #6E6E73;   /* secondary text */
  --faint:   #A1A1A6;   /* earlier versions, meta */
  --rule:    #E8E8EA;
  --gold:    #B3A06B;   /* the one hairline of colour */
  --gold-ink:#8A7640;   /* gold as text, passes contrast on white */
  --hover:   #F4F4F5;

  /* SF Pro on iPad/Mac; Inter Tight elsewhere */
  --sans: -apple-system, BlinkMacSystemFont, "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;

  --t-hero: clamp(64px, 11vw, 132px);
  --t-chapter: clamp(40px, 5vw, 56px);
  --t-now: clamp(26px, 2.8vw, 34px);
  --t-body: 19px;
  --t-label: 13px;
  --t-meta: 14px;

  --measure: 680px;
  --gutter: clamp(20px, 7vw, 96px);
  --bar-h: 56px;
  --ctx-w: 300px;
  color-scheme: light;
}
/* ── Settings sheet ── */
.set-group { margin-top: 8px; padding: 18px; border-radius: 22px; background: #F5F6F8; display: grid; gap: 16px; }
.set-row { display: flex; justify-content: space-between; align-items: baseline; }
.set-row h3 { font: 600 17px/1.2 var(--sans); letter-spacing: -.01em; }
.swatches { display: grid; grid-template-columns: repeat(auto-fit, minmax(58px, 1fr)); gap: 12px 4px; }
.swatch-opt { display: grid; justify-items: center; gap: 8px; padding: 6px 0; border-radius: 14px; }
.swatch-opt .dot { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: 0 0 0 3px #F5F6F8, 0 0 0 4px transparent; transition: box-shadow .2s; }
.swatch-opt[aria-checked="true"] .dot { box-shadow: 0 0 0 3px #F5F6F8, 0 0 0 5px var(--ink); }
.swatch-opt .nm { font: 500 13px/1.2 var(--sans); color: var(--muted); }
.swatch-opt[aria-checked="true"] .nm { color: var(--ink); font-weight: 600; }
.set-preview { padding: 18px 20px; border-radius: 16px; background: #fff; font: 800 clamp(34px, 5vw, 44px)/1.05 var(--sans); letter-spacing: -.045em; }
.set-preview span { background: linear-gradient(115deg, var(--g1), var(--g2) 50%, var(--g3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.set-ver { margin-top: 16px; text-align: center; }
.set-group + .set-group { margin-top: 14px; }
.field { display: grid; gap: 6px; }
.field > span { font: 600 13px/1.2 var(--sans); color: var(--muted); }
.field input { width: 100%; height: 46px; border: 1px solid var(--rule); border-radius: 12px; padding: 0 14px; background: #fff; color: var(--ink); font: 500 17px/1 var(--sans); letter-spacing: -.01em; }
.field input:focus { outline: 2px solid var(--ink); outline-offset: 0; }
.set-group .sw-row { border-top: 0; padding: 0; }
.sw-row small { display: block; margin-top: 2px; font: 400 13px/1.35 var(--sans); color: var(--muted); }
.set-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.set-btns .pill { background: #fff; }
.set-group .as-status:empty { display: none; }
/* Right Now sheet */
.lead-pick { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 14px; }
.now-compose { margin-bottom: 4px; }
.now-compose label { font: 600 14px/1.2 var(--sans); color: var(--muted); }
.now-versions { display: grid; gap: 6px; margin-top: 8px; }
.now-versions .label { margin-top: 10px; }
.nv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0 10px 2px; border-top: 1px solid var(--rule); }
.nv p { font: 600 18px/1.4 var(--sans); letter-spacing: -.01em; white-space: pre-wrap; }
.nv.old p { font-weight: 500; color: var(--muted); }
.nv .meta { display: block; margin-top: 2px; }
#nowSheet .as-status .link, #setStatus .link { margin-left: 6px; }

/* ── Studio: the app's look. White, big titles in a colour gradient, soft grey rounded surfaces.
   The colour is chosen from the menu; everything else stays the same in every colour. ── */
:root[data-look="studio"] {
  --g1: #0B0B0F; --g2: #3A3D48; --g3: #9CA1AE;
  --bg: #FFFFFF; --ink: #0B0B0F; --muted: #6B6F7B; --faint: #A3A7B2; --rule: #ECEDF0;
  --gold: var(--g2); --gold-ink: var(--g1); --hover: #F3F4F6; color-scheme: light;
}
:root[data-tint="blue"]     { --g1: #1638C9; --g2: #2F62E6; --g3: #7FA9F3; }
:root[data-tint="violet"]   { --g1: #4B22C9; --g2: #7A4DEB; --g3: #C3A8FA; }
:root[data-tint="ocean"]    { --g1: #05608A; --g2: #1597C9; --g3: #7FD3F0; }
:root[data-tint="emerald"]  { --g1: #0A6B55; --g2: #12A37F; --g3: #7FDDBF; }
:root[data-tint="rose"]     { --g1: #B01E5B; --g2: #E0457F; --g3: #F6A6C4; }
:root[data-tint="sunset"]   { --g1: #B83A14; --g2: #F07A2E; --g3: #F8C25C; }
:root[data-look="studio"] .statement h1 {
  background: linear-gradient(115deg, var(--g1) 0%, var(--g2) 50%, var(--g3) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .06em;
}
@media (hover: hover) { :root[data-look="studio"] .launcher a:hover { color: var(--g2); } }
:root[data-look="studio"] .pill, :root[data-look="studio"] :is(.as-actions, .annot-bar) .primary { border-radius: 999px; }
:root[data-look="studio"] :is(.layout-menu, .sheet, .annot-sheet) { border-radius: 24px; }
/* Section tiles and grid cells are separate grey rounded buttons instead of one ruled box */
:root[data-look="studio"] .gridx:not(.swipe) { background: none; border: 0; border-radius: 0; overflow: visible; gap: 12px; }
:root[data-look="studio"] .gridx.swipe { gap: 12px; background: none; border: 0; grid-auto-columns: calc((100% - 24px) / 3.15); }
:root[data-look="studio"] .gridx.swipe > * { border: 0; }
@media (orientation: portrait), (max-width: 899px) {
  :root[data-look="studio"] .gridx.swipe { grid-auto-columns: calc((100% - 12px) / 2.15); }
}
:root[data-look="studio"] :is(.tile, .cell, .cardx .body) { background: #F3F4F6; border: 0; border-radius: 24px; }
:root[data-look="studio"] .ncard { border-radius: 22px; box-shadow: 0 16px 36px -28px rgba(11,11,15,.35); }
@media (hover: hover) { :root[data-look="studio"] :is(.tile, .cell):hover { background: #EAEBEE; } }

/* ── Base ───────────────────────────────────────────────── */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 var(--t-body)/1.5 var(--sans); letter-spacing: -.01em;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.label { font: 600 var(--t-label)/1.2 var(--sans); letter-spacing: 0; color: var(--muted); }
.meta { font: 400 var(--t-meta)/1.4 var(--sans); letter-spacing: 0; color: var(--faint); }

/* ── App frame: one column by default (portrait / compact) ─ */
.app { min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
.topbar {
  grid-column: 1 / -1; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  height: var(--bar-h); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid transparent; transition: border-color .2s;
}
.topbar .wordmark { font: 700 17px/1 var(--sans); letter-spacing: -.02em; }
.topbar .end { justify-self: end; display: flex; gap: 4px; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 22px; color: var(--ink); }
@media (hover: hover) { .icon-btn:hover { background: var(--hover); } }
.icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
.back-btn { display: inline-flex; align-items: center; gap: 2px; height: 44px; padding-right: 12px; border-radius: 22px; font: 600 17px/1 var(--sans); letter-spacing: -.01em; color: var(--ink); }
.back-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (hover: hover) { .back-btn:hover { color: var(--muted); } }

.context { display: none; }
.main { min-width: 0; padding-inline: var(--gutter); padding-block: 0 140px; }
.column { max-width: var(--measure); margin-inline: auto; }

/* ── Landscape, regular width: wider page ──────────────── */
@media (orientation: landscape) and (min-width: 900px) {
  .main { padding-inline: clamp(40px, 5vw, 80px); }
  html.fit .home { align-content: center !important; gap: clamp(16px, 3.2vh, 64px) !important; }
  .home .statement h1 span { display: inline; }            /* one line in landscape */
  .home .statement h1 { font-size: clamp(56px, 11vh, 132px); }
}
/* ── Landscape, wide: + context panel ───────────────────── */
@media (orientation: landscape) and (min-width: 1100px) {
  .app { grid-template-columns: minmax(0, 1fr) var(--ctx-w); }
  .context {
    display: block; position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); align-self: start;
    height: calc(100dvh - var(--bar-h) - env(safe-area-inset-top, 0px)); overflow-y: auto;
    padding: 32px max(24px, env(safe-area-inset-right, 0px)) 32px 28px; border-left: 1px solid var(--rule);
  }
  .home .latest { display: none; }                  /* lives in the context panel */
  .app.inner { grid-template-columns: minmax(0, 1fr); }
  .app.inner .context { display: none; }
}

/* ── Drawer nav ───────────────────────────────── */
.nav { display: grid; gap: 2px; }
.nav a {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  padding: 10px 12px; border-radius: 10px; font: 500 16px/1.2 var(--sans); letter-spacing: -.01em; color: var(--muted);
}
@media (hover: hover) { .nav a:hover { color: var(--ink); background: var(--hover); } }
.nav a[aria-current="page"] { color: var(--ink); font-weight: 700; background: var(--hover); }
.nav a .count { font: 400 13px/1 var(--sans); color: var(--faint); }
.nav .gap { height: 14px; }

/* ── Home: one screen, no scroll on iPad ────────────────── */
.home { max-width: 960px; margin-inline: auto; display: grid; gap: 40px; padding-block: 32px 48px; }
.statement { display: grid; justify-items: center; text-align: center; gap: 14px; }
.statement h1 { font: 800 clamp(52px, 7.6vh, 124px)/.9 var(--sans); letter-spacing: -.045em; }
.statement h1 span { display: block; }
.statement .sub { font: 500 clamp(15px, 1.5vh, 18px)/1.4 var(--sans); color: var(--muted); }
.statement .sub b { color: var(--ink); font-weight: 600; }
.statement::after { content: ""; width: 48px; height: 1px; background: var(--gold); margin-top: 4px; }

.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--ink); }
.block-head h2 { font: 800 clamp(24px, 2.6vh, 34px)/1 var(--sans); letter-spacing: -.035em; }

.now-grid ul { margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; }
.now-grid li { list-style: none; display: grid; align-content: start; gap: 4px; padding-block: clamp(12px, 1.6vh, 22px); border-bottom: 1px solid var(--rule); }
.now-grid .lead { font: 600 13px/1.2 var(--sans); color: var(--faint); }
.now-grid .sentence { font: 700 clamp(17px, 1.85vh, 26px)/1.2 var(--sans); letter-spacing: -.025em;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.now-item { width: 100%; display: grid; gap: 4px; text-align: left; border-radius: 4px; }
@media (hover: hover) { .now-item:hover .sentence { color: var(--muted); } }
.now-empty { font: 500 clamp(17px, 1.85vh, 22px)/1.4 var(--sans); color: var(--muted); padding-block: 12px; }
.add-line { justify-self: start; display: inline-flex; align-items: center; gap: 8px; font: 600 15px/1 var(--sans); color: var(--ink); padding: 12px 0 0; }
.add-line::before { content: "+"; font: 400 22px/1 var(--sans); }

/* Home contents: a plain launcher list, one word per line */
.launcher { justify-self: center; align-self: center; }

/* Home statement and list sit on the left, like a phone launcher; What changed stays as it is */
.home-page .statement { justify-items: start; text-align: left; }
.home-page .launcher { justify-self: start; }
.launcher ul { margin: 0; padding: 0; list-style: none; display: grid; gap: clamp(0px, .3vh, 6px); }
.launcher a {
  display: inline-block; font: 500 clamp(28px, 3.7vh, 56px)/1.1 var(--sans); letter-spacing: -.03em;
  color: var(--ink); text-transform: lowercase; transition: color .15s, transform .2s;
}
@media (hover: hover) { .launcher a:hover { color: var(--muted); transform: translateX(4px); } }

.latest { display: grid; gap: 12px; }
.latest .rows { display: grid; gap: 10px; }
.latest .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; font: 700 clamp(15px, 1.6vh, 20px)/1.3 var(--sans); letter-spacing: -.02em; }
.latest .row { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; }
.latest .row > span:last-child { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.latest .topic { font: 600 13px/1.6 var(--sans); color: var(--faint); letter-spacing: 0; }
.latest .old { color: var(--faint); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.latest .to { color: var(--gold-ink); font-weight: 500; }
/* each change stays on one line, shortening long entries, so the home screen never grows */
.latest .row > span:last-child { flex-wrap: nowrap; min-width: 0; }
.latest .row .old, .latest .row .new { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.latest .row .old { flex: 0 3 auto; }
.latest .row .new { flex: 0 1 auto; }
.latest .row :is(.to, .meta) { flex: none; }
.latest .row-empty { font: 500 clamp(15px, 1.6vh, 18px)/1.4 var(--sans); color: var(--muted); }

/* Context-panel history (landscape wide) */
.thread { margin-top: 4px; position: relative; padding-left: 24px; }
.thread::before { content: ""; position: absolute; left: 5px; top: 12px; bottom: 12px; width: 1px; background: var(--rule); }
.thread .step { position: relative; padding-block: 6px 12px; display: grid; gap: 2px; }
.thread .step::before { content: ""; position: absolute; left: -24px; top: 12px; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--faint); }
.thread .step.now-step::before { background: var(--ink); border-color: var(--ink); }
.thread .quote { font: 700 17px/1.3 var(--sans); letter-spacing: -.015em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.thread .step:not(.now-step) .quote { color: var(--faint); }
.change { display: grid; gap: 4px; }
.change .was { font: 700 17px/1.3 var(--sans); color: var(--faint); text-decoration: line-through; }
.change .is { font: 700 17px/1.3 var(--sans); }
.change :is(.was, .is), .change .why { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.change .why, .why-q { margin-top: 6px; font: 500 15px/1.45 var(--sans); color: var(--muted); padding-left: 12px; border-left: 2px solid var(--gold); }
.ctx-item.link-row { color: inherit; }
.ctx-empty { font: 500 15px/1.45 var(--sans); color: var(--muted); }
.ctx-links { display: flex; flex-wrap: wrap; gap: 10px 18px; }
.link { font: 600 14px/1 var(--sans); color: var(--ink); white-space: nowrap; }
@media (hover: hover) { .link:hover { text-decoration: underline; text-underline-offset: 4px; } }

/* Fit the home screen to the window on anything iPad-sized */
@media (min-width: 700px) and (min-height: 600px) {
  html.fit { overflow: hidden; }
  html.fit .main { padding-block: 0; }
  html.fit .home {
    height: calc(100dvh - var(--bar-h) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    align-content: space-evenly; gap: clamp(12px, 2vh, 40px);
    padding-block: clamp(12px, 3vh, 48px) clamp(16px, 3vh, 40px); overflow: hidden;
  }
}

/* ── Context panel ──────────────────────────────────────── */
.ctx-block { display: grid; gap: 18px; }
.ctx-block + .ctx-block { margin-top: 40px; padding-top: 28px; border-top: 1px solid var(--rule); }
.ctx-item { display: grid; gap: 2px; }
.ctx-item .v { font: 700 19px/1.3 var(--sans); letter-spacing: -.015em; }
.ctx-item .v.changed { color: var(--gold-ink); }

/* ── Chapter page: same one-screen composition ───────── */
.statement .eyebrow { font: 600 13px/1.2 var(--sans); color: var(--faint); }
/* Topics as a Notes-style list: date groups, rounded card, three-line rows */
.notes { width: 100%; }
/* Section pages use the full width of the screen */
.home.chapter-page { max-width: none; gap: clamp(20px, 3vh, 32px); padding-block: clamp(20px, 3.5vh, 40px) 96px; }
/* A smaller title on section pages so the list leads */
.home.chapter-page .statement { gap: 8px; }
.home.chapter-page .statement h1 { font-size: clamp(34px, 4.2vh, 56px); }
.home.chapter-page .statement .sub { font-size: clamp(13px, 1.3vh, 15px); }
html:not(.fit) .main { padding-inline: max(20px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-right, 0px)); }
.ngroup { margin-bottom: clamp(12px, 1.8vh, 22px); }
.ngroup h2 { break-after: avoid; font: 700 clamp(18px, 1.9vh, 22px)/1.2 var(--sans); letter-spacing: -.02em; margin: 0 0 8px 4px; }
.ncard { border: 1px solid var(--rule); border-radius: 12px; background: var(--bg); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.note { break-inside: avoid; display: flex; align-items: center; gap: 12px; padding: clamp(7px, .95vh, 12px) 14px; position: relative; min-width: 0; }
.note + .note::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; height: 1px; background: var(--rule); }
@media (hover: hover) { .note:hover { background: var(--hover); border-radius: 11px; } }
.note .txt { flex: 1; min-width: 0; display: grid; gap: 1px; }
.note h3 { font: 700 clamp(15px, 1.55vh, 18px)/1.25 var(--sans); letter-spacing: -.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note .l2 { font: 400 clamp(13px, 1.35vh, 15px)/1.3 var(--sans); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }


/* ── My History: a focus card driven by a scrolling, fading timeline ── */
.hist { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 64px); min-height: 0; align-items: stretch; }
.hist-focus {
  align-self: center; padding: clamp(8px, 1.5vw, 24px) 0;
  display: grid; gap: 14px; align-content: center; min-height: min(100%, 460px);
}
.hist-focus.in { animation: histIn .35s ease; }
@keyframes histIn { from { opacity: .2; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.hf-kind { display: flex; align-items: center; gap: 8px; font: 600 13px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.hf-kind svg { width: 18px; height: 18px; }
.hf-date { font: 500 16px/1.2 var(--sans); color: var(--faint); }
.hf-said { font: 800 clamp(28px, 3.6vw, 46px)/1.1 var(--sans); letter-spacing: -.035em; text-wrap: balance;
  display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.hf-led { font: 500 clamp(17px, 1.6vw, 21px)/1.4 var(--sans); color: var(--muted); padding-top: 6px; border-top: 1px solid var(--rule); }
@media (hover: hover) { a.hf-kind:hover { color: var(--ink); } }
.hist-secs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.hist-empty { display: grid; gap: 14px; align-content: center; justify-items: start; max-width: 560px; color: var(--muted); font: 500 clamp(17px, 1.8vh, 21px)/1.45 var(--sans); }
.chip { display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 999px; background: #F3F4F6; font: 600 14px/1 var(--sans); letter-spacing: -.005em; color: var(--ink); white-space: nowrap; }
@media (hover: hover) { .chip:hover { background: #EAEBEE; } }
.chip[aria-checked="true"] { background: var(--ink); color: #fff; }
.hist svg { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

.hist-rail {
  position: relative; min-height: 0; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none;
  -webkit-mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent);
          mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent);
}
.hist-rail::-webkit-scrollbar { display: none; }
.hist-rail:focus-visible { outline: none; }
.hist-pad { height: calc(50% - 44px); }
.hist-item {
  width: 100%; display: grid; grid-template-columns: 14px 28px minmax(0, 1fr); align-items: start; gap: 12px; text-align: left;
  padding: 14px 8px; scroll-snap-align: center; position: relative; transition: opacity .15s;
}
.hist-item::before { content: ""; position: absolute; left: 14px; top: 0; bottom: 0; width: 1px; background: var(--rule); }
.hist-dot { width: 9px; height: 9px; margin: 6px 0 0 1px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--faint); position: relative; z-index: 1; }
.hist-ic { color: var(--muted); transition: transform .2s, color .2s; transform-origin: left center; }
.hist-ic svg { width: 20px; height: 20px; margin-top: 1px; }
.hist-txt { display: grid; gap: 2px; }
.hist-date { font: 500 14px/1.2 var(--sans); color: var(--faint); }
.hist-said { font: 600 clamp(16px, 1.5vw, 19px)/1.3 var(--sans); letter-spacing: -.015em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.hist-item[aria-selected="true"] .hist-dot { background: var(--ink); border-color: var(--ink); }
.hist-item[aria-selected="true"] .hist-ic { color: var(--ink); transform: scale(1.3); }
.hist-item[aria-selected="true"] .hist-date { color: var(--ink); }

/* Fit My History to the screen: title on top, the two panes fill the rest */
.history-page .statement { justify-items: start; text-align: left; gap: 6px; }
.history-page .statement h1 { font-size: clamp(28px, 3.4vh, 44px); }
html.fit .home.history-page { align-content: stretch !important; grid-template-rows: auto minmax(0, 1fr); padding-bottom: clamp(16px, 3vh, 32px); }
@media (orientation: portrait), (max-width: 899px) {
  .hist { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); gap: 16px; }
  .hist-focus { min-height: 0; padding: 8px 0 16px; }
}
@media (max-width: 699px), (max-height: 599px) {
  .hist-rail { height: 60vh; }
}

/* ── Section layouts: Cards, Grid, Tiles (List is the .notes style above) ── */
.cards { columns: 3; column-gap: 16px; }
.cardx { display: block; break-inside: avoid; margin-bottom: 18px; }
.cardx .body { border: 1px solid var(--rule); border-radius: 12px; background: var(--bg); padding: 18px; display: grid; gap: 12px; transition: transform .2s; }
@media (hover: hover) { .cardx:hover .body { transform: translateY(-2px); } }
.cardx .sw { height: 150px; border-radius: 8px; }
.cardx .quote { font: 600 20px/1.3 var(--sans); letter-spacing: -.02em; text-wrap: balance; }
.cardx.empty .body { border-style: dashed; min-height: 84px; place-content: center; color: var(--faint); font: 500 15px/1.3 var(--sans); }
.cardx .cap { margin: 6px 4px 0; font: 400 13px/1.3 var(--sans); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cardx .cap b { font-weight: 600; color: var(--muted); }

.gridx { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.cell { background: var(--bg); padding: 22px; min-height: 200px; display: grid; align-content: start; gap: 10px; }
@media (hover: hover) { .cell:hover { background: var(--hover); } }
.cell h3 { font: 700 19px/1.25 var(--sans); letter-spacing: -.015em; }
.cell p { font: 400 16px/1.5 var(--sans); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.cell.empty h3 { font-weight: 500; color: var(--faint); }
@media (hover: hover) { .blank:hover { background: var(--bg); } }
.gridx .fill2 { display: none; }
.tile { background: var(--bg); padding: clamp(20px, 2.6vw, 36px); min-height: 150px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 6px; font: 500 clamp(20px, 2.5vh, 30px)/1.2 var(--sans); letter-spacing: -.015em; }
/* the context line under each section's name */
.tile .td { font: 400 clamp(13px, 1.5vh, 16px)/1.35 var(--sans); letter-spacing: -.005em; color: var(--muted);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cell .cd { margin-top: -6px; font: 400 14px/1.35 var(--sans); color: var(--faint); }
/* Tiles sit on a 6-column grid so a short last row can stretch instead of showing empty boxes */
.gridx.tiles6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.tiles6 .tile { grid-column: span 2; }
.tiles6 .last3-1 { grid-column: span 6; }
.tiles6 .last3-2 { grid-column: span 3; }
@media (orientation: portrait), (max-width: 899px) {
  .tiles6 .tile, .tiles6 .last3-1, .tiles6 .last3-2 { grid-column: span 3; }
  .tiles6 .last2-1 { grid-column: span 6; }
}
@media (max-width: 520px) {
  .tiles6 .tile, .tiles6 .last3-1, .tiles6 .last3-2, .tiles6 .last2-1 { grid-column: span 6; }
}
/* Tiles pages fit one screen: the grid takes the space under the title and the tiles share it evenly */
html.fit .home.tiles-page { align-content: stretch !important; grid-template-rows: auto minmax(0, 1fr); padding-bottom: clamp(16px, 3vh, 32px); }
html.fit .tiles-page .gridx { height: 100%; grid-auto-rows: minmax(0, 1fr); }
html.fit .tiles-page .tile { min-height: 0; }
@media (hover: hover) { .tile:hover { background: var(--hover); } }

/* Grid layout: two rows, swiped sideways; part of the next column peeks in */
.gridx.swipe {
  grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: calc((100% - 2px) / 3.15);
  grid-template-rows: repeat(2, clamp(170px, calc((100dvh - var(--bar-h) - 400px) / 2), 340px));
  gap: 0; background: var(--bg);
  overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.gridx.swipe::-webkit-scrollbar { display: none; }
.gridx.swipe > * { scroll-snap-align: start; min-height: 0; overflow: hidden; border-right: 1px solid var(--rule); }
.gridx.swipe > :nth-child(odd) { border-bottom: 1px solid var(--rule); }   /* odd cells are the top row */

@media (orientation: portrait), (max-width: 899px) {
  .cards { columns: 2; }
  .gridx.swipe { grid-auto-columns: calc((100% - 1px) / 2.15); }
  .gridx { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gridx .fill3 { display: none; }
  .gridx .fill2 { display: flex; }
}
@media (max-width: 520px) {
  .cards { columns: 1; }
  .gridx.swipe { grid-auto-columns: calc(100% / 1.15); }
  .gridx { grid-template-columns: 1fr; }
  .gridx .fill2, .gridx .fill3 { display: none; }
}

/* Layout menu, opened from the top-right button on section pages */
.layout-menu {
  position: fixed; z-index: 60; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 4px); right: max(12px, env(safe-area-inset-right, 0px));
  width: min(300px, calc(100vw - 24px)); padding: 6px; border-radius: 14px; background: var(--bg);
  box-shadow: 0 0 0 1px var(--rule), 0 20px 50px -18px rgba(0,0,0,.3);
}
.layout-menu .mhead { padding: 10px 12px 6px; font: 600 13px/1.2 var(--sans); color: var(--faint); }
.layout-menu button { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; text-align: left; padding: 10px 12px; border-radius: 10px; }
@media (hover: hover) { .layout-menu button:hover, .layout-menu button:focus-visible { background: var(--hover); } }
.layout-menu .n { font: 600 16px/1.2 var(--sans); }
.layout-menu .d { grid-column: 1; font: 400 13px/1.3 var(--sans); color: var(--muted); }
.layout-menu .ck { grid-row: 1 / span 2; grid-column: 2; align-self: center; font: 700 16px/1 var(--sans); visibility: hidden; }
.layout-menu [aria-checked="true"] .ck { visibility: visible; }

/* ── Annotate: draw on the screen, explain it, save it ── */
.annot { position: fixed; inset: 0; z-index: 80; }
.annot canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.annot::before { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px #E5484D; pointer-events: none; }
.annot-bar {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 16px; background: var(--bg);
  box-shadow: 0 0 0 1px var(--rule), 0 16px 40px -12px rgba(0,0,0,.35); max-width: calc(100vw - 24px); overflow-x: auto;
}
.annot-bar button { height: 40px; padding: 0 12px; border-radius: 11px; font: 600 15px/1 var(--sans); white-space: nowrap; }
@media (hover: hover) { .annot-bar button:hover { background: var(--hover); } }
.annot-bar .primary, .as-actions .primary { background: var(--ink); color: var(--bg); }
.annot-bar .swatch { width: 40px; padding: 0; display: grid; place-items: center; }
.swatch span { width: 20px; height: 20px; border-radius: 50%; box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--rule); }
.swatch.on span { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
.annot-sep { width: 1px; height: 24px; background: var(--rule); margin: 0 4px; flex: none; }
.annot-sheet {
  position: fixed; z-index: 90; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 32px));
  max-height: calc(100dvh - 48px); overflow-y: auto; background: var(--bg); border-radius: 20px;
  box-shadow: 0 0 0 1px var(--rule), 0 30px 80px -20px rgba(0,0,0,.4); padding: 8px 20px 20px;
}
.as-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
.as-head h2 { font: 800 22px/1.2 var(--sans); letter-spacing: -.02em; }
.as-body { display: grid; gap: 10px; }
.as-body img { width: 100%; border-radius: 12px; border: 1px solid var(--rule); }
.as-label { font: 600 14px/1.2 var(--sans); color: var(--muted); }
.as-body textarea { width: 100%; font: 400 17px/1.45 var(--sans); color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; resize: vertical; }
.as-body textarea:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
.as-status { font: 500 14px/1.4 var(--sans); color: var(--muted); min-height: 1.4em; }
.as-actions { display: flex; justify-content: flex-end; gap: 8px; }
.as-actions button, .as-item button { height: 42px; padding: 0 16px; border-radius: 12px; font: 600 15px/1 var(--sans); border: 1px solid var(--rule); }
.as-actions .primary { border-color: var(--ink); }
.as-actions button:disabled { opacity: .5; }
.as-where { font: 400 14px/1.4 var(--sans); color: var(--muted); margin-bottom: 12px; }
.as-list { display: grid; gap: 14px; }
.as-item { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; padding-top: 14px; border-top: 1px solid var(--rule); }
.as-item img { width: 120px; border-radius: 8px; border: 1px solid var(--rule); }
.as-item .meta { margin-bottom: 4px; }
.as-item p.n { font: 500 16px/1.4 var(--sans); white-space: pre-wrap; }
.as-item .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.as-item button { height: 34px; padding: 0 12px; font-size: 14px; }
.as-empty { color: var(--muted); padding: 12px 0; }

/* ── Sections, entries and Trash ── */
.pill { height: 38px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--rule); font: 600 15px/1 var(--sans); }
@media (hover: hover) { .pill:hover { background: var(--hover); } }
.entry-card { border: 1px solid var(--rule); border-radius: 14px; padding: 16px; display: grid; gap: 6px; }
.et { font: 600 19px/1.35 var(--sans); letter-spacing: -.015em; }
.entry-card .btns { margin-top: 6px; }
.sheet-foot { display: grid; gap: 8px; justify-items: start; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--rule); }
.switches { display: grid; }
.sw-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 2px; border-top: 1px solid var(--rule); font: 500 17px/1.3 var(--sans); cursor: pointer; }
.sw-row input { position: absolute; opacity: 0; pointer-events: none; }
.sw-row i { flex: none; width: 46px; height: 28px; border-radius: 14px; background: var(--rule); position: relative; transition: background .2s; }
.sw-row i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.sw-row input:checked + i { background: var(--ink); }
.sw-row input:checked + i::after { transform: translateX(18px); }
.sw-row input:focus-visible + i { outline: 2px solid var(--ink); outline-offset: 2px; }
.all-hidden { display: grid; gap: 14px; justify-items: center; align-content: center; text-align: center; color: var(--muted); padding: 48px 0; }
.trash-btn {
  position: fixed; z-index: 30; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: var(--faint);
}
@media (hover: hover) { .trash-btn:hover { color: var(--ink); background: var(--hover); } }
.trash-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.trash-btn span { position: absolute; top: 4px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--ink); color: var(--bg); font: 700 10px/16px var(--sans); text-align: center; }
.trash-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding-top: 14px; border-top: 1px solid var(--rule); }
.trash-item .left { font: 600 13px/1.3 var(--sans); color: var(--gold-ink); margin-top: 4px; }

/* ── Section page: one section, its entries and earlier versions ── */
.entry-page { max-width: 760px; margin-inline: auto; padding-block: clamp(20px, 3.5vh, 44px) 120px; display: grid; gap: 22px; }
.entry-page .statement { justify-items: start; text-align: left; gap: 8px; }
.entry-page .statement h1 { font-size: clamp(40px, 5.4vh, 68px); }
.entry-page .statement .sub { font-size: clamp(16px, 1.7vh, 19px); }
.entry-page .statement::after { display: none; }
.entry-page a.eyebrow { color: var(--muted); }
@media (hover: hover) { .entry-page a.eyebrow:hover { color: var(--ink); } }
.compose { background: #F3F4F6; border-radius: 24px; padding: 18px 18px 14px 20px; display: grid; gap: 10px; transition: box-shadow .2s; }
.compose:focus-within { box-shadow: 0 0 0 2px var(--g2, var(--ink)); }
.compose textarea { width: 100%; border: 0; background: transparent; resize: none; outline: none; color: var(--ink); font: 500 19px/1.45 var(--sans); letter-spacing: -.01em; min-height: 56px; }
.compose textarea::placeholder { color: var(--faint); }
.compose-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.btn-primary { height: 40px; padding: 0 18px; border-radius: 999px; background: var(--ink); color: #fff; font: 600 15px/1 var(--sans); flex: none; transition: opacity .2s; }
.btn-primary:disabled { opacity: .3; cursor: default; }
.entry-page .as-status:empty { display: none; }
.entry-page .as-status .link { margin-left: 6px; color: var(--g1, var(--ink)); }
.latest-card { border: 1px solid var(--rule); border-radius: 24px; padding: 18px 20px 24px 24px; display: grid; gap: 8px; box-shadow: 0 16px 36px -28px rgba(11,11,15,.35); }
.e-top { display: flex; justify-content: space-between; align-items: center; }
.e-label { display: inline-flex; align-items: center; gap: 8px; font: 600 13px/1.2 var(--sans); color: var(--muted); }
.e-label::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, var(--g1, var(--ink)), var(--g3, var(--ink))); }
.latest-card .big { font: 600 clamp(22px, 2.6vw, 30px)/1.3 var(--sans); letter-spacing: -.02em; text-wrap: pretty; white-space: pre-wrap; }
.e-del { width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; color: var(--faint); flex: none; }
.e-del svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
@media (hover: hover) { .e-del:hover { color: var(--ink); background: var(--hover); } }
.earlier { display: grid; gap: 4px; }
.earlier ol { list-style: none; margin: 0; padding: 0; }
.earlier li { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 0 12px 4px; border-top: 1px solid var(--rule); }
.earlier .e-when { font: 500 14px/1.9 var(--sans); color: var(--faint); }
.earlier li p { font: 500 17px/1.45 var(--sans); color: var(--muted); padding-top: 4px; white-space: pre-wrap; }
.sec-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.sec-nav a { display: grid; gap: 4px; padding: 16px 20px; border-radius: 20px; background: #F3F4F6; font: 600 17px/1.25 var(--sans); letter-spacing: -.01em; }
.sec-nav a.next { text-align: right; }
@media (hover: hover) { .sec-nav a:hover { background: #EAEBEE; } }
.sec-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
/* "Why did it change?" under a new version, and the why shown with it afterwards */
.why-in { width: 100%; border: 0; border-top: 1px solid #E3E5E9; background: transparent; outline: none; color: var(--ink); font: 400 17px/1.4 var(--sans); letter-spacing: -.01em; padding: 10px 0 2px; }
.why-in::placeholder { color: var(--faint); }
.latest-card .why-q { margin-top: 2px; font-size: 16px; white-space: pre-wrap; }
.earlier li .why-q { margin-top: 6px; font-size: 14px; white-space: pre-wrap; }
.empty-note { font: 500 17px/1.45 var(--sans); color: var(--muted); padding: 8px 0; }
/* Records (memories, old thoughts…): each entry is its own, so they're listed side by side, not as versions */
.records { display: grid; gap: 12px; }
.record { border: 1px solid var(--rule); border-radius: 20px; padding: 14px 16px 18px 20px; display: grid; gap: 4px; }
.record p { font: 500 19px/1.4 var(--sans); letter-spacing: -.01em; white-space: pre-wrap; }
/* Decisions: thought → decided → did → changed */
.compose .step-field { display: grid; gap: 2px; }
.compose .step-field + .step-field { padding-top: 10px; border-top: 1px solid #E3E5E9; }
.step-field > span, .ds-k { font: 600 12px/1.2 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.compose .step-field textarea { min-height: 30px; font-size: 18px; }
.decisions { display: grid; gap: 14px; }
.decision { border: 1px solid var(--rule); border-radius: 24px; padding: 14px 16px 18px 24px; display: grid; gap: 4px; box-shadow: 0 16px 36px -28px rgba(11,11,15,.35); }
.dsteps { list-style: none; margin: 0; padding: 0 0 0 22px; position: relative; display: grid; }
.dsteps::before { content: ""; position: absolute; left: 4px; top: 14px; bottom: 14px; width: 1px; background: var(--rule); }
.dsteps li { position: relative; display: grid; gap: 2px; padding: 7px 0; }
.dsteps li::before { content: ""; position: absolute; left: -22px; top: 13px; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--faint); }
.dsteps li.on::before { background: var(--g2, var(--ink)); border-color: var(--g2, var(--ink)); }
.dsteps p { font: 500 17px/1.4 var(--sans); white-space: pre-wrap; }
.dsteps li.decided p { font: 700 clamp(20px, 2.4vw, 26px)/1.3 var(--sans); letter-spacing: -.02em; }
.ds-add { font: 600 15px/1.2 var(--sans); color: var(--muted); padding: 2px 0; justify-self: start; }
@media (hover: hover) { .ds-add:hover { color: var(--ink); } }
.ds-form { display: grid; gap: 8px; }
.ds-form textarea { width: 100%; border: 0; border-radius: 14px; background: #F3F4F6; resize: none; outline: none; color: var(--ink); font: 500 17px/1.45 var(--sans); padding: 10px 12px; }
.ds-form textarea:focus { box-shadow: 0 0 0 2px var(--g2, var(--ink)); }
.ds-row { display: flex; justify-content: flex-end; gap: 8px; }
/* What Changed: every section whose entry has been replaced */
.changes { display: grid; gap: 12px; }
.change-card { display: grid; gap: 4px; padding: 16px 20px 18px; border-radius: 22px; background: #F3F4F6; }
@media (hover: hover) { .change-card:hover { background: #EAEBEE; } }
.change-card .was { font: 600 17px/1.35 var(--sans); color: var(--faint); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.change-card .is { font: 700 clamp(19px, 2.2vw, 23px)/1.3 var(--sans); letter-spacing: -.015em; }
@media (max-width: 520px) { .earlier li { grid-template-columns: minmax(0, 1fr) auto; } .earlier .e-when { grid-column: 1 / -1; line-height: 1.2; } }

/* ── Drawer + search sheet ──────────────────────────────── */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .25); opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; z-index: 50; top: 0; bottom: 0; left: 0; width: min(320px, 86vw);
  background: var(--bg); transform: translateX(-102%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 24px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto;
  box-shadow: 1px 0 0 var(--rule);
}
.drawer.open { transform: none; }
.app-version { padding: 24px 12px 0; }
.drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 0 0 16px 12px; }
.sheet {

        ${x.latest.why ? `<p class="why-q">${esc(x.latest.why)}</p>` : ""}</a>`).join("")}</section>`
      : `<p class="empty-note">When you write a new entry in a section that already has one, the old one is kept, and the change shows up here.</p>`}
    ${notes.length ? `<h2 class="label">Notes</h2>${recordsHTML(notes)}` : ""}
    ${secNav(c, name)}

  </div>`;
}
function secNav(c, name) {   // the neighbouring sections in the curated order, skipping hidden ones
  const i = c.parts.findIndex(p => p[0] === name), hid = new Set(hiddenOf(c.id));
  const around = step => { for (let j = i + step; j >= 0 && j < c.parts.length; j += step) if (!hid.has(c.parts[j][0])) return c.parts[j][0]; return null; };
  const prev = around(-1), next = around(1);
  return `<nav class="sec-nav" aria-label="Other sections">
      ${prev ? `<a href="#${c.id}/${slug(prev)}"><span class="meta">‹ Previous</span><b>${esc(prev)}</b></a>` : "<span></span>"}
      ${next ? `<a class="next" href="#${c.id}/${slug(next)}"><span class="meta">Next ›</span><b>${esc(next)}</b></a>` : "<span></span>"}
    </nav>`;
}
const secFoot = (c, name) => hiddenOf(c.id).includes(name)
  ? `<div class="sec-foot"><button type="button" class="pill" data-show>Show this section</button>
      <span class="meta">It’s hidden from ${esc(c.title)}. Everything in it is kept.</span></div>`
  : `<div class="sec-foot"><button type="button" class="pill" data-hide>Hide this section</button>
      <span class="meta">Hiding keeps everything. Show it again from ⋯ → Sections on ${esc(c.title)}.</span></div>`;

function initSection(c, name) {
  const form = $("#compose"); if (!form) return;   // What Changed has nothing to write
  const add = $("#composeAdd"), fields = [...form.querySelectorAll("textarea")], why = $("#composeWhy");
  const main = form.querySelector('[data-step="decided"]') || $("#composeText");
  const grow = t => { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 320) + "px"; };
  form.addEventListener("input", e => {
    if (e.target.tagName === "TEXTAREA") grow(e.target);
    add.disabled = !main.value.trim();
    if (why) why.hidden = !main.value.trim() && !why.value;
  });
  form.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); form.requestSubmit(); } });
  form.onsubmit = e => {
    e.preventDefault();
    const text = main.value.trim(); if (!text) return;
    const entry = { text };
    if (main.dataset.step) { entry.steps = {}; for (const t of fields) if (t.value.trim()) entry.steps[t.dataset.step] = t.value.trim(); }
    if (why && why.value.trim()) entry.why = why.value.trim();
    if (!addEntry(c.id, name, entry)) { $("#entryStatus").textContent = "Couldn’t save. This device’s storage may be full; your words are still in the box."; return; }
    render(); $("#entryStatus").textContent = "Saved.";
  };
}

/* Home, landscape: the side panel. One change as its versions, one as before → after with its why. */
function contextHTML() {
  const all = changes(), label = `<span class="label">What changed</span>`;
  const links = `<div class="ctx-links"><a class="link" href="#history/what-changed">All changes →</a><a class="link" href="#history">Full timeline →</a></div>`;
  if (!all.length) return `<div class="ctx-block">${label}<p class="ctx-empty">Nothing yet. When you write a new entry in a section, the old one stays, and the change shows up here.</p>${links}</div>`;
  const why = all.find(x => x.latest.why), thread = all.find(x => x !== why), change = why || all.find(x => x !== thread);
  const st = thread ? thread.versions.slice(-3) : [], last = st.length - 1;
  return `${thread ? `<div class="ctx-block">${label}
      <a class="ctx-item link-row" href="${thread.href}"><span class="meta">${esc(thread.topic)} · ${esc(thread.where)}</span></a>
      <div class="thread">${st.map((s, i) => `<div class="step ${i === last ? "now-step" : ""}">
        <span class="meta">${esc(s.when)}${i === last ? " · now" : ""}</span><p class="quote">“${esc(cap(s.text))}”</p></div>`).join("")}</div></div>` : ""}
    <div class="ctx-block">${thread ? "" : label}${change ? `<a class="change" href="${change.href}">
      <span class="meta">${esc(change.topic)} · changed ${esc(change.latest.when)}</span>

      ${change.latest.why ? `<p class="why">“${esc(change.latest.why)}”</p>` : ""}</a>` : ""}
      ${links}</div>`;
}

function render() {

  const [cid, sid] = raw.split("/");

  if (chapter && sid) { section = (chapter.parts.find(p => slug(p[0]) === sid) || [])[0] || null; if (!section) chapter = null; }
  const route = chapter ? cid : raw === "now" ? "now" : "home";

/* Search covers every version of everything, not just the latest */
const norm = s => s.toLowerCase().replace(/[’‘]/g, "'").replace(/[“”]/g, '"');
function buildIndex() {
  const idx = [{ text: "Right now", where: "Page", href: "#now" }, ...chapters.map(c => ({ text: c.title, where: "Chapter", href: `#${c.id}` }))];
  for (const c of chapters) for (const name of visibleNames(c)) {
    const href = `#${c.id}/${slug(name)}`;
    idx.push({ text: name, where: c.title, href, also: c.parts.find(p => p[0] === name)[1] });
    for (const e of entriesFor(c.id, name)) idx.push({ text: e.text, where: `${c.title} › ${name} · ${e.when}`, href, also: [e.why, ...Object.values(e.steps || {})].filter(Boolean).join(" ") });
  }
  for (const l of nowLeads) for (const e of entriesFor("now", l.id)) idx.push({ text: `${l.lead} ${e.text}`, where: `Right Now · ${e.when}`, href: "#now" });
  for (const m of timeline()) if (!m.href) idx.push({ text: m.said, where: `My History · ${m.when}`, href: "#history", also: m.led });
  return idx;
}
function search(q) {
  const t = norm(q.trim()), index = buildIndex();
  const hits = t ? index.filter(i => norm(`${i.text} ${i.also || ""}`).includes(t)).slice(0, 30) : index.slice(0, chapters.length + 1);
  $("#results").innerHTML = hits.length
    ? hits.map(h => `<a href="${h.href}"><span>${esc(h.text)}</span><span class="meta">${esc(h.where)}</span></a>`).join("")
    : `<p class="empty">Nothing in the archive mentions “${esc(q)}” yet.</p>`;
}

function timeLeft(t) {

  const d = Math.ceil(ms / DAY), h = Math.ceil(ms / 3600000), m = Math.max(1, Math.ceil(ms / 60000));
  return ms > DAY ? `${d} days left` : ms > 3600000 ? `${h} hour${h > 1 ? "s" : ""} left` : `${m} minute${m > 1 ? "s" : ""} left`;
}

/* Right Now: tap a sentence to update it. The old one is kept as an earlier version. */
let nowDraft = "";
function openNow(id, { status = "", focus = false, keepDraft = false } = {}) {
  if (!keepDraft) nowDraft = "";
  const lead = nowLeads.find(l => l.id === id) || nowLeads.find(l => !entriesFor("now", l.id).length) || nowLeads[0];
  const [cur, ...older] = entriesFor("now", lead.id);
  $("#nowSheet").innerHTML = `<div class="as-head"><h2>Right now</h2><button type="button" class="icon-btn" data-close aria-label="Close">${closeIcon}</button></div>
    <div class="lead-pick" role="radiogroup" aria-label="Which part of right now">${nowLeads.map(l => `<button type="button" class="chip" role="radio" aria-checked="${l.id === lead.id}" data-pick="${l.id}">${esc(l.lead)}</button>`).join("")}</div>

      <label for="nowText">${esc(lead.lead)}…</label>
      <textarea id="nowText" rows="2" placeholder="${cur ? "What’s true now?" : "Finish the sentence."}"></textarea>
      <div class="compose-row"><span class="meta">${cur ? "What’s here now becomes an earlier version." : "Only you can see this."}</span><button type="submit" class="btn-primary" id="nowSave" disabled>Save</button></div>
    </form>
    <p class="as-status" id="nowStatus" role="status">${status}</p>
    ${cur ? `<div class="now-versions"><h3 class="label">Now · since ${monthYear(cur.at)}</h3>
      <div class="nv"><p>${esc(cap(cur.text))}</p>${delBtn(cur.tkey)}</div>
      ${older.length ? `<h3 class="label">Earlier</h3>${older.map(e => `<div class="nv old"><div><p>${esc(cap(e.text))}</p><span class="meta">${esc(e.when)}</span></div>${delBtn(e.tkey, "Delete this version")}</div>`).join("")}` : ""}
    </div>` : ""}`;
  openSheet("#nowSheet");
  const ta = $("#nowText"), save = $("#nowSave");
  ta.value = nowDraft; save.disabled = !ta.value.trim();
  ta.oninput = () => { nowDraft = ta.value; save.disabled = !ta.value.trim(); };
  ta.onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("#nowForm").requestSubmit(); } };
  $("#nowForm").onsubmit = e => {
    e.preventDefault();
    const t = ta.value.trim(); if (!t) return;
    if (!addEntry("now", lead.id, { text: t })) { $("#nowStatus").textContent = "Couldn’t save. This device’s storage may be full."; return; }
    nowDraft = ""; render();
  };
  $("#nowSheet").onclick = e => {
    if (e.target.closest("[data-close]")) return closeAll();

    const del = e.target.closest("[data-del]");
    if (del) {
      if (trashEntry("now", lead.id, del.dataset.del)) { render(); openNow(lead.id, { status: `Moved to Trash for ${TRASH_DAYS} days. <button type="button" class="link" data-undo="${esc(del.dataset.del)}">Undo</button>` }); }
      return;
    }
    const undo = e.target.closest("[data-undo]");
    if (undo) { restoreEntry(undo.dataset.undo); render(); openNow(lead.id); }
  };
  if (focus) setTimeout(() => ta.focus(), 50);
}

/* Backup: the whole archive as one file you can keep, and bring back on any device */
function backupData() {
  const data = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k.startsWith("about-me-") || k === "about-me-annotations") continue;   // design comments aren't part of the archive
      const raw = localStorage.getItem(k);
      try { data[k] = k.startsWith("about-me-layout") ? raw : JSON.parse(raw); } catch (e) {}
    }
  } catch (e) {}
  return { app: "About Me", format: 1, exportedAt: new Date().toISOString(), data };
}
async function exportBackup() {
  const name = `About Me backup ${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([JSON.stringify(backupData(), null, 2)], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "About Me backup" }); return "shared"; }
  } catch (e) { if (e.name === "AbortError") return "cancelled"; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  return "downloaded";
}
function importBackup(text) {   // adds whatever this device doesn't have; never replaces or removes an entry
  const b = JSON.parse(text), d = b && b.app === "About Me" && b.data;
  if (!d || typeof d !== "object") throw new Error("Not an About Me backup");
  const entries = store("about-me-entries", {});
  let added = 0;
  for (const [key, list] of Object.entries(d["about-me-entries"] || {})) {
    if (!Array.isArray(list)) continue;
    const have = new Set((entries[key] = entries[key] || []).map(e => e.id));
    for (const e of list) if (e && typeof e.id === "string" && typeof e.text === "string" && typeof e.at === "number" && !have.has(e.id)) { entries[key].push(e); have.add(e.id); added++; }
    entries[key].sort((x, y) => x.at - y.at);
    if (!entries[key].length) delete entries[key];
  }
  keep("about-me-entries", entries);
  const trash = purgeTrash(), inTrash = new Set(trash.map(t => t.key));
  for (const t of Array.isArray(d["about-me-trash"]) ? d["about-me-trash"] : []) if (t && typeof t.key === "string" && typeof t.deletedAt === "number" && !inTrash.has(t.key)) { trash.push(t); inTrash.add(t.key); }
  keep("about-me-trash", trash);
  keep("about-me-purged", [...new Set([...store("about-me-purged", []), ...(Array.isArray(d["about-me-purged"]) ? d["about-me-purged"] : [])])]);
  const hidden = store("about-me-hidden", {});
  for (const [id, names] of Object.entries(d["about-me-hidden"] || {})) if (Array.isArray(names)) hidden[id] = [...new Set([...(hidden[id] || []), ...names])];
  keep("about-me-hidden", hidden);
  // Preferences come back as they were when the backup was made
  for (const k of ["about-me-tint", "about-me-person", "about-me-examples"]) if (k in d) keep(k, d[k]);
  for (const [k, v] of Object.entries(d)) if (k.startsWith("about-me-layout-v2:") && typeof v === "string") try { localStorage.setItem(k, v); } catch (e) {}
  applyTint(currentTint());
  purgeTrash();
  return added;
}

/* Settings: colour, your name, example entries and backups */
function openSettings(status = "") {
  const now = currentTint(), tint = TINTS.find(t => t.id === now), { name, line } = me();
  const total = chapters.reduce((n, c) => n + c.parts.reduce((m, [p]) => m + entriesFor(c.id, p).length, 0), 0) + nowLeads.reduce((n, l) => n + entriesFor("now", l.id).length, 0);
  $("#settingsSheet").innerHTML = `<div class="as-head"><h2>Settings</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close">${closeIcon}</button></div>
    <section class="set-group" aria-labelledby="setColor">
      <div class="set-row"><h3 id="setColor">Color</h3><span class="meta">${esc(tint.name)}</span></div>
      <div class="swatches" role="radiogroup" aria-labelledby="setColor">${TINTS.map(t => `<button type="button" class="swatch-opt" role="radio" aria-checked="${t.id === now}" data-tint="${t.id}">
        <span class="dot" style="--c1:${t.c1};--c2:${t.c2}"></span><span class="nm">${t.name}</span></button>`).join("")}</div>
      <p class="set-preview" aria-hidden="true"><span>About Me.</span></p>
    </section>
    <section class="set-group" aria-labelledby="setYou">
      <div class="set-row"><h3 id="setYou">You</h3></div>
      <label class="field"><span>Name</span><input id="setName" type="text" value="${esc(name)}" autocomplete="name" maxlength="40" placeholder="Your name"></label>
      <label class="field"><span>Under About Me</span><input id="setLine" type="text" value="${esc(line)}" maxlength="80" placeholder="An ongoing record of me."></label>
    </section>
    <section class="set-group" aria-labelledby="setData">
      <div class="set-row"><h3 id="setData">Your archive</h3><span class="meta">${plural(total, "entry", "entries")}</span></div>
      <label class="sw-row"><span>Example entries<small>The entries About Me came with. Turning them off hides them; your own entries stay.</small></span>
        <input type="checkbox" role="switch" id="setExamples" ${examplesOn() ? "checked" : ""}><i aria-hidden="true"></i></label>
      <p class="meta">Everything is saved only on this device. Export a backup now and then, and keep it in Files or iCloud Drive.</p>
      <div class="set-btns"><button type="button" class="pill" id="setExport">Export backup</button><button type="button" class="pill" id="setImport">Import a backup</button>
        <input type="file" id="setFile" accept=".json,application/json" hidden></div>
      <p class="as-status" id="setStatus" role="status">${status}</p>
    </section>
    ${$("#appVersion").textContent ? `<p class="meta set-ver">${esc($("#appVersion").textContent)}</p>` : ""}`;
  openSheet("#settingsSheet");
  $("#settingsSheet").onclick = async e => {
    if (e.target.closest("[data-close]")) return closeAll();
    const b = e.target.closest(".swatch-opt[data-tint]");
    if (b) { keep("about-me-tint", b.dataset.tint); applyTint(b.dataset.tint); return openSettings(); }
    if (e.target.closest("#setExport")) { const how = await exportBackup(); $("#setStatus").textContent = how === "cancelled" ? "" : "Backup ready. Keep it somewhere safe, like Files or iCloud Drive."; }
    if (e.target.closest("#setImport")) $("#setFile").click();
  };
  $("#setFile").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    let msg;
    try { const n = importBackup(await f.text()); msg = n ? `Imported ${plural(n, "entry", "entries")}. Nothing here was replaced.` : "Everything in that backup is already here."; }
    catch (err) { msg = "That file isn’t an About Me backup."; }
    render(); openSettings(esc(msg));
  };
  const setMe = (k, v) => { keep("about-me-person", { ...store("about-me-person", {}), [k]: v.trim() }); const sub = $("#homeSub"); if (sub) sub.innerHTML = subLine(); };
  $("#setName").oninput = e => setMe("name", e.target.value);
  $("#setLine").oninput = e => setMe("line", e.target.value);
  $("#setExamples").onchange = e => {
    keep("about-me-examples", e.target.checked); render();
    openSettings(e.target.checked ? "Example entries are back." : "Example entries are hidden. Turn them on again any time.");
  };
}
$("#settingsBtn").onclick = e => { e.stopPropagation(); closeAll(); openSettings(); };
applyTint(currentTint());

/* ── Annotate ─────────────────────────────────────────────
   Draw over the current screen, explain the change, save it.
   In the Claude preview comments go to the artifact's private database,
   where Claude can read them. Elsewhere (the Home Screen app) they are
   kept on this device, with Share to send them on. */
const annot = { strokes: [], color: "#E5484D", drawing: null, shot: null };
let dbReady = null;   // the artifact database, when this view has it
let dbTried = false;
async function annotDB() {
  if (dbTried) return dbReady;
  dbTried = true;
  try { dbReady = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { dbReady = null; }
  return dbReady;
}
function sizeCanvas() {
  const c = $("#annotCanvas"), r = window.devicePixelRatio || 1;
  c.width = Math.round(innerWidth * r); c.height = Math.round(innerHeight * r);
  redraw();
}
function redraw() {
  const c = $("#annotCanvas"), ctx = c.getContext("2d"), r = c.width / innerWidth;
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const st of annot.strokes) {
    for (let i = 1; i < st.pts.length; i++) {
      const a = st.pts[i - 1], b = st.pts[i];
      ctx.strokeStyle = st.color; ctx.lineWidth = 2 + 4 * (b.p || .5);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    if (st.pts.length === 1) { const a = st.pts[0]; ctx.fillStyle = st.color; ctx.beginPath(); ctx.arc(a.x, a.y, 3, 0, 7); ctx.fill(); }
  }
}
function openAnnotate() {
  closeAll();
  annot.strokes = [];
  $("#annot").hidden = false;
  sizeCanvas();
}
function closeAnnotate() { $("#annot").hidden = true; $("#annotSheet").hidden = true; annot.strokes = []; }
$("#annotateBtn").onclick = openAnnotate;
addEventListener("resize", () => { if (!$("#annot").hidden) sizeCanvas(); });
(() => {
  const c = $("#annotCanvas");
  c.addEventListener("pointerdown", e => {
    c.setPointerCapture(e.pointerId);
    annot.drawing = { color: annot.color, pts: [{ x: e.clientX, y: e.clientY, p: e.pressure || .5 }] };
    annot.strokes.push(annot.drawing); redraw();
  });
  c.addEventListener("pointermove", e => {
    if (!annot.drawing) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of evs) annot.drawing.pts.push({ x: ev.clientX, y: ev.clientY, p: ev.pressure || .5 });
    redraw();
  });
  const end = () => { annot.drawing = null; };
  c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end);
})();
document.querySelectorAll(".swatch").forEach(b => b.onclick = () => {
  annot.color = b.dataset.color;
  document.querySelectorAll(".swatch").forEach(x => x.classList.toggle("on", x === b));
});
$("#annotUndo").onclick = () => { annot.strokes.pop(); redraw(); };
$("#annotClear").onclick = () => { annot.strokes = []; redraw(); };
$("#annotCancel").onclick = closeAnnotate;

function loadHtml2canvas() {
  if (window.html2canvas) return Promise.resolve(window.html2canvas);
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    s.onload = () => ok(window.html2canvas); s.onerror = fail;
    document.head.appendChild(s);
  });
}
// The screen as it looks right now, with the drawing on top, as a small JPEG
async function captureScreen() {
  const w = innerWidth, h = innerHeight, scale = Math.min(1, 900 / w);
  const out = document.createElement("canvas");
  out.width = Math.round(w * scale); out.height = Math.round(h * scale);
  const ctx = out.getContext("2d");
  ctx.fillStyle = getComputedStyle(document.body).backgroundColor || "#fff"; ctx.fillRect(0, 0, out.width, out.height);
  try {
    const h2c = await loadHtml2canvas();
    const page = await h2c(document.body, { x: scrollX, y: scrollY, width: w, height: h, windowWidth: w, windowHeight: h, scale, useCORS: true, logging: false,
      backgroundColor: null,
      // the screenshot library can't read color-mix(); give the copy solid backgrounds instead
      onclone: doc => { const st = doc.createElement("style"); st.textContent = ".topbar{background:var(--bg)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}*{animation:none!important;transition:none!important}"; doc.head.appendChild(st); } });
    ctx.drawImage(page, 0, 0, out.width, out.height);
  } catch (e) { /* no screenshot: the drawing alone still says a lot */ }
  ctx.drawImage($("#annotCanvas"), 0, 0, out.width, out.height);
  let q = .72, url = out.toDataURL("image/jpeg", q);
  while (url.length > 180000 && q > .3) { q -= .12; url = out.toDataURL("image/jpeg", q); }
  return url;
}
function pageName() {
  const [cid, sid] = (location.hash.slice(1) || "home").split("/"), c = chapters.find(x => x.id === cid);
  const s = c && sid && c.parts.find(p => slug(p[0]) === sid);
  return s ? `${c.title} › ${s[0]}` : c ? c.title : cid === "now" ? "Right Now" : "Home";
}
$("#annotDone").onclick = async () => {
  $("#annotDone").disabled = true; $("#annotDone").textContent = "…";
  annot.shot = await captureScreen();
  $("#annotDone").disabled = false; $("#annotDone").textContent = "Done";
  $("#asPreview").src = annot.shot;
  $("#asStatus").textContent = "";
  $("#annotSheet").hidden = false;
  setTimeout(() => $("#asNote").focus(), 50);
};
$("#asBack").onclick = $("#asClose").onclick = () => { $("#annotSheet").hidden = true; };

const LOCAL_KEY = "about-me-annotations";
function localList() { try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); } catch (e) { return []; } }
function localSave(list) { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(list)); return true; } catch (e) { return false; } }

$("#asSave").onclick = async () => {
  const note = $("#asNote").value.trim();
  if (!note && !annot.strokes.length) { $("#asStatus").textContent = "Draw something or write a note first."; return; }
  const item = {
    page: location.hash.slice(1) || "home", pageName: pageName(), note, image: annot.shot,
    orientation: innerWidth > innerHeight ? "landscape" : "portrait", size: `${innerWidth}×${innerHeight}`,
    layout: (() => { const c = chapters.find(x => x.id === location.hash.slice(1)); return c ? getLayout(c.id) : null; })(),
    createdAt: new Date().toISOString(),
  };
  $("#asSave").disabled = true; $("#asStatus").textContent = "Saving…";
  const db = await annotDB();
  let saved = false, where = "";
  if (db) {
    try { await db.collection("annotations").doc("a" + Date.now()).set(item); saved = true; where = "Saved. Claude can read it now."; }
    catch (e) { where = ""; }
  }
  if (!saved) {
    const list = localList(); list.unshift({ id: "a" + Date.now(), ...item });
    saved = localSave(list.slice(0, 40));
    where = saved ? "Saved on this iPad. Open Saved and tap Share to send it to Claude." : "";
  }
  $("#asSave").disabled = false;
  if (!saved) { $("#asStatus").textContent = "Couldn’t save. Your note is still here; try again in a moment."; return; }
  $("#asStatus").textContent = where;
  $("#asNote").value = "";
  setTimeout(() => { closeAnnotate(); }, 1400);
};

async function listSaved() {
  const db = await annotDB();
  if (db) {
    try {
      const snap = await db.collection("annotations").orderBy("createdAt", "desc").limit(50).get();
      return { where: "db", items: snap.docs.map(d => ({ id: d.id, ...d.data() })) };
    } catch (e) { /* fall back to this device */ }
  }
  return { where: "local", items: localList() };
}
async function showSaved() {
  $("#savedSheet").hidden = false;
  $("#ssList").innerHTML = `<p class="as-empty">Loading…</p>`;
  const { where, items } = await listSaved();
  $("#ssWhere").textContent = where === "db" ? "Saved to this preview. Claude can read these." : "Saved on this iPad. Tap Share to send one to Claude.";
  $("#ssList").innerHTML = items.length ? items.map(it => `<div class="as-item" data-id="${esc(it.id)}">
      ${it.image ? `<img src="${it.image}" alt="Drawing on ${esc(it.pageName)}">` : "<span></span>"}
      <div><p class="meta">${esc(it.pageName)} · ${new Date(it.createdAt).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}</p>
        <p class="n">${esc(it.note || "(no note)")}</p>
        <div class="btns">${where === "local" && navigator.share ? `<button type="button" data-act="share">Share</button>` : ""}<button type="button" data-act="delete">Delete</button></div></div>
    </div>`).join("") : `<p class="as-empty">No saved comments yet.</p>`;
  $("#ssList").onclick = async e => {
    const btn = e.target.closest("[data-act]"); if (!btn) return;
    const id = btn.closest(".as-item").dataset.id, it = items.find(x => x.id === id);
    if (btn.dataset.act === "delete") {
      if (where === "db") { try { await (await annotDB()).collection("annotations").doc(id).delete(); } catch (err) {} }
      else localSave(localList().filter(x => x.id !== id));
      showSaved();
    }
    if (btn.dataset.act === "share") {
      const text = `About Me feedback — ${it.pageName} (${it.orientation}, ${it.size}):\n${it.note}`;
      try {
        const blob = await (await fetch(it.image)).blob();
        const file = new File([blob], `about-me-${it.page}.jpg`, { type: "image/jpeg" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], text });
        else await navigator.share({ text });
      } catch (err) { /* share sheet closed */ }
    }
  };
}
$("#annotSaved").onclick = showSaved;
$("#ssClose").onclick = () => { $("#savedSheet").hidden = true; };

addEventListener("hashchange", render);
render();
</script>
