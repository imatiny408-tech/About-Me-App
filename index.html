<title>About Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap">
<style>
/* ── Tokens ─────────────────────────────────────────────── */
:root {
  --bg:      #FFFFFF;
  --ink:     #0B0B0C;   /* headline black */
  --muted:   #6E6E73;   /* secondary text */
  --faint:   #A1A1A6;   /* earlier versions, meta */
  --rule:    #E8E8EA;
  --gold:    #B3A06B;   /* the one hairline of colour */
  --gold-ink:#8A7640;   /* gold as text, passes contrast on white */
  --hover:   #F4F4F5;

  /* SF Pro on iPad/Mac; Inter Tight elsewhere */
  --sans: -apple-system, BlinkMacSystemFont, "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;

  --t-hero: clamp(64px, 11vw, 132px);
  --t-chapter: clamp(40px, 5vw, 56px);
  --t-now: clamp(26px, 2.8vw, 34px);
  --t-body: 19px;
  --t-label: 13px;
  --t-meta: 14px;

  --measure: 680px;
  --gutter: clamp(20px, 7vw, 96px);
  --bar-h: 56px;
  --ctx-w: 300px;
  color-scheme: light;
}
/* ── Colour menu in the drawer ── */
.looks { margin-top: 24px; padding: 16px 12px 0; border-top: 1px solid var(--rule); display: grid; gap: 4px; }
.looks .label { margin-bottom: 6px; }
.look-opt { display: flex; align-items: center; gap: 12px; padding: 8px 6px; border-radius: 10px; font: 500 16px/1.2 var(--sans); text-align: left; }
@media (hover: hover) { .look-opt:hover { background: var(--hover); } }
.look-opt .chip { width: 26px; height: 26px; border-radius: 50%; flex: none; background: linear-gradient(135deg, var(--c1), var(--c2)); }
.look-opt .ck { margin-left: auto; font-weight: 700; visibility: hidden; }
.look-opt[aria-checked="true"] .ck { visibility: visible; }

/* ── Studio: the app's look. White, big titles in a colour gradient, soft grey rounded surfaces.
   The colour is chosen from the menu; everything else stays the same in every colour. ── */
:root[data-look="studio"] {
  --g1: #1638C9; --g2: #2F62E6; --g3: #7FA9F3;
  --bg: #FFFFFF; --ink: #0B0B0F; --muted: #6B6F7B; --faint: #A3A7B2; --rule: #ECEDF0;
  --gold: var(--g2); --gold-ink: var(--g1); --hover: #F3F4F6; color-scheme: light;
}
:root[data-tint="violet"]   { --g1: #4B22C9; --g2: #7A4DEB; --g3: #C3A8FA; }
:root[data-tint="ocean"]    { --g1: #05608A; --g2: #1597C9; --g3: #7FD3F0; }
:root[data-tint="emerald"]  { --g1: #0A6B55; --g2: #12A37F; --g3: #7FDDBF; }
:root[data-tint="rose"]     { --g1: #B01E5B; --g2: #E0457F; --g3: #F6A6C4; }
:root[data-tint="sunset"]   { --g1: #B83A14; --g2: #F07A2E; --g3: #F8C25C; }
:root[data-tint="graphite"] { --g1: #0B0B0F; --g2: #3A3D48; --g3: #9CA1AE; }
:root[data-look="studio"] .statement h1 {
  background: linear-gradient(115deg, var(--g1) 0%, var(--g2) 50%, var(--g3) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .06em;
}
@media (hover: hover) { :root[data-look="studio"] .launcher a:hover { color: var(--g2); } }
:root[data-look="studio"] .pill, :root[data-look="studio"] :is(.as-actions, .annot-bar) .primary { border-radius: 999px; }
:root[data-look="studio"] :is(.layout-menu, .sheet, .annot-sheet) { border-radius: 24px; }
/* Section tiles and grid cells are separate grey rounded buttons instead of one ruled box */
:root[data-look="studio"] .gridx:not(.swipe) { background: none; border: 0; border-radius: 0; overflow: visible; gap: 12px; }
:root[data-look="studio"] .gridx.swipe { gap: 12px; background: none; border: 0; grid-auto-columns: calc((100% - 24px) / 3.15); }
:root[data-look="studio"] .gridx.swipe > * { border: 0; }
@media (orientation: portrait), (max-width: 899px) {
  :root[data-look="studio"] .gridx.swipe { grid-auto-columns: calc((100% - 12px) / 2.15); }
}
:root[data-look="studio"] :is(.tile, .cell, .cardx .body) { background: #F3F4F6; border: 0; border-radius: 24px; }
:root[data-look="studio"] .ncard { border-radius: 22px; box-shadow: 0 16px 36px -28px rgba(11,11,15,.35); }
@media (hover: hover) { :root[data-look="studio"] :is(.tile, .cell):hover { background: #EAEBEE; } }

/* ── Base ───────────────────────────────────────────────── */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 var(--t-body)/1.5 var(--sans); letter-spacing: -.01em;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.label { font: 600 var(--t-label)/1.2 var(--sans); letter-spacing: 0; color: var(--muted); }
.meta { font: 400 var(--t-meta)/1.4 var(--sans); letter-spacing: 0; color: var(--faint); }

/* ── App frame: one column by default (portrait / compact) ─ */
.app { min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
.topbar {
  grid-column: 1 / -1; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  height: var(--bar-h); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid transparent; transition: border-color .2s;
}
.topbar .wordmark { font: 700 17px/1 var(--sans); letter-spacing: -.02em; }
.topbar .end { justify-self: end; display: flex; gap: 4px; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 22px; color: var(--ink); }
@media (hover: hover) { .icon-btn:hover { background: var(--hover); } }
.icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
.back-btn { display: inline-flex; align-items: center; gap: 2px; height: 44px; padding-right: 12px; border-radius: 22px; font: 600 17px/1 var(--sans); letter-spacing: -.01em; color: var(--ink); }
.back-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (hover: hover) { .back-btn:hover { color: var(--muted); } }

.context { display: none; }
.main { min-width: 0; padding-inline: var(--gutter); padding-block: 0 140px; }
.column { max-width: var(--measure); margin-inline: auto; }

/* ── Landscape, regular width: wider page ──────────────── */
@media (orientation: landscape) and (min-width: 900px) {
  .main { padding-inline: clamp(40px, 5vw, 80px); }
  html.fit .home { align-content: center !important; gap: clamp(16px, 3.2vh, 64px) !important; }
  .home .statement h1 span { display: inline; }            /* one line in landscape */
  .home .statement h1 { font-size: clamp(56px, 11vh, 132px); }
}
/* ── Landscape, wide: + context panel ───────────────────── */
@media (orientation: landscape) and (min-width: 1100px) {
  .app { grid-template-columns: minmax(0, 1fr) var(--ctx-w); }
  .context {
    display: block; position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); align-self: start;
    height: calc(100dvh - var(--bar-h) - env(safe-area-inset-top, 0px)); overflow-y: auto;
    padding: 32px max(24px, env(safe-area-inset-right, 0px)) 32px 28px; border-left: 1px solid var(--rule);
  }
  .home .latest { display: none; }                  /* lives in the context panel */
  .app.inner { grid-template-columns: minmax(0, 1fr); }
  .app.inner .context { display: none; }
}

/* ── Drawer nav ───────────────────────────────── */
.nav { display: grid; gap: 2px; }
.nav a {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  padding: 10px 12px; border-radius: 10px; font: 500 16px/1.2 var(--sans); letter-spacing: -.01em; color: var(--muted);
}
@media (hover: hover) { .nav a:hover { color: var(--ink); background: var(--hover); } }
.nav a[aria-current="page"] { color: var(--ink); font-weight: 700; background: var(--hover); }
.nav a .count { font: 400 13px/1 var(--sans); color: var(--faint); }
.nav .gap { height: 14px; }

/* ── Home: one screen, no scroll on iPad ────────────────── */
.home { max-width: 960px; margin-inline: auto; display: grid; gap: 40px; padding-block: 32px 48px; }
.statement { display: grid; justify-items: center; text-align: center; gap: 14px; }
.statement h1 { font: 800 clamp(52px, 7.6vh, 124px)/.9 var(--sans); letter-spacing: -.045em; }
.statement h1 span { display: block; }
.statement .sub { font: 500 clamp(15px, 1.5vh, 18px)/1.4 var(--sans); color: var(--muted); }
.statement .sub b { color: var(--ink); font-weight: 600; }
.statement::after { content: ""; width: 48px; height: 1px; background: var(--gold); margin-top: 4px; }

.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--ink); }
.block-head h2 { font: 800 clamp(24px, 2.6vh, 34px)/1 var(--sans); letter-spacing: -.035em; }

.now-grid ul { margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; }
.now-grid li { list-style: none; display: grid; align-content: start; gap: 4px; padding-block: clamp(12px, 1.6vh, 22px); border-bottom: 1px solid var(--rule); }
.now-grid .lead { font: 600 13px/1.2 var(--sans); color: var(--faint); }
.now-grid .sentence { font: 700 clamp(17px, 1.85vh, 26px)/1.2 var(--sans); letter-spacing: -.025em; }
.add-line { justify-self: start; display: inline-flex; align-items: center; gap: 8px; font: 600 15px/1 var(--sans); color: var(--ink); padding: 12px 0 0; }
.add-line::before { content: "+"; font: 400 22px/1 var(--sans); }

/* Home contents: a plain launcher list, one word per line */
.launcher { justify-self: center; align-self: center; }

/* Home statement and list sit on the left, like a phone launcher; What changed stays as it is */
.home-page .statement { justify-items: start; text-align: left; }
.home-page .launcher { justify-self: start; }
.launcher ul { margin: 0; padding: 0; list-style: none; display: grid; gap: clamp(0px, .3vh, 6px); }
.launcher a {
  display: inline-block; font: 500 clamp(28px, 3.7vh, 56px)/1.1 var(--sans); letter-spacing: -.03em;
  color: var(--ink); text-transform: lowercase; transition: color .15s, transform .2s;
}
@media (hover: hover) { .launcher a:hover { color: var(--muted); transform: translateX(4px); } }

.latest { display: grid; gap: 12px; }
.latest .rows { display: grid; gap: 10px; }
.latest .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; font: 700 clamp(15px, 1.6vh, 20px)/1.3 var(--sans); letter-spacing: -.02em; }
.latest .row { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; }
.latest .row > span:last-child { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.latest .topic { font: 600 13px/1.6 var(--sans); color: var(--faint); letter-spacing: 0; }
.latest .old { color: var(--faint); }
.latest .was { color: var(--faint); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.latest .to { color: var(--gold-ink); font-weight: 500; }

/* Context-panel history (landscape wide) */
.thread { margin-top: 4px; position: relative; padding-left: 24px; }
.thread::before { content: ""; position: absolute; left: 5px; top: 12px; bottom: 12px; width: 1px; background: var(--rule); }
.thread .step { position: relative; padding-block: 6px 12px; display: grid; gap: 2px; }
.thread .step::before { content: ""; position: absolute; left: -24px; top: 12px; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--faint); }
.thread .step.now-step::before { background: var(--ink); border-color: var(--ink); }
.thread .quote { font: 700 17px/1.3 var(--sans); letter-spacing: -.015em; }
.thread .step:not(.now-step) .quote { color: var(--faint); }
.change { display: grid; gap: 4px; }
.change .was { font: 700 17px/1.3 var(--sans); color: var(--faint); text-decoration: line-through; }
.change .is { font: 700 17px/1.3 var(--sans); }
.change .why { margin-top: 6px; font: 500 15px/1.45 var(--sans); color: var(--muted); padding-left: 12px; border-left: 2px solid var(--gold); }
.link { font: 600 14px/1 var(--sans); color: var(--ink); white-space: nowrap; }
@media (hover: hover) { .link:hover { text-decoration: underline; text-underline-offset: 4px; } }

/* Fit the home screen to the window on anything iPad-sized */
@media (min-width: 700px) and (min-height: 600px) {
  html.fit { overflow: hidden; }
  html.fit .main { padding-block: 0; }
  html.fit .home {
    height: calc(100dvh - var(--bar-h) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    align-content: space-evenly; gap: clamp(12px, 2vh, 40px);
    padding-block: clamp(12px, 3vh, 48px) clamp(16px, 3vh, 40px); overflow: hidden;
  }
}

/* ── Context panel ──────────────────────────────────────── */
.ctx-block { display: grid; gap: 18px; }
.ctx-block + .ctx-block { margin-top: 40px; padding-top: 28px; border-top: 1px solid var(--rule); }
.ctx-item { display: grid; gap: 2px; }
.ctx-item .v { font: 700 19px/1.3 var(--sans); letter-spacing: -.015em; }
.ctx-item .v.changed { color: var(--gold-ink); }

/* ── Chapter page: same one-screen composition ───────── */
.statement .eyebrow { font: 600 13px/1.2 var(--sans); color: var(--faint); }
/* Topics as a Notes-style list: date groups, rounded card, three-line rows */
.notes { width: 100%; }
/* Section pages use the full width of the screen */
.home.chapter-page { max-width: none; gap: clamp(20px, 3vh, 32px); padding-block: clamp(20px, 3.5vh, 40px) 96px; }
/* A smaller title on section pages so the list leads */
.home.chapter-page .statement { gap: 8px; }
.home.chapter-page .statement h1 { font-size: clamp(34px, 4.2vh, 56px); }
.home.chapter-page .statement .sub { font-size: clamp(13px, 1.3vh, 15px); }
html:not(.fit) .main { padding-inline: max(20px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-right, 0px)); }
.ngroup { margin-bottom: clamp(12px, 1.8vh, 22px); }
.ngroup h2 { break-after: avoid; font: 700 clamp(18px, 1.9vh, 22px)/1.2 var(--sans); letter-spacing: -.02em; margin: 0 0 8px 4px; }
.ncard { border: 1px solid var(--rule); border-radius: 12px; background: var(--bg); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.note { break-inside: avoid; display: flex; align-items: center; gap: 12px; padding: clamp(7px, .95vh, 12px) 14px; position: relative; min-width: 0; }
.note + .note::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; height: 1px; background: var(--rule); }
@media (hover: hover) { .note:hover { background: var(--hover); border-radius: 11px; } }
.note .txt { flex: 1; min-width: 0; display: grid; gap: 1px; }
.note h3 { font: 700 clamp(15px, 1.55vh, 18px)/1.25 var(--sans); letter-spacing: -.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note .l2 { font: 400 clamp(13px, 1.35vh, 15px)/1.3 var(--sans); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }


/* ── My History: a focus card driven by a scrolling, fading timeline ── */
.hist { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 64px); min-height: 0; align-items: stretch; }
.hist-focus {
  align-self: center; padding: clamp(8px, 1.5vw, 24px) 0;
  display: grid; gap: 14px; align-content: center; min-height: min(100%, 460px);
}
.hist-focus.in { animation: histIn .35s ease; }
@keyframes histIn { from { opacity: .2; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.hf-kind { display: flex; align-items: center; gap: 8px; font: 600 13px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.hf-kind svg { width: 18px; height: 18px; }
.hf-date { font: 500 16px/1.2 var(--sans); color: var(--faint); }
.hf-said { font: 800 clamp(28px, 3.6vw, 46px)/1.1 var(--sans); letter-spacing: -.035em; text-wrap: balance; }
.hf-led { font: 500 clamp(17px, 1.6vw, 21px)/1.4 var(--sans); color: var(--muted); padding-top: 6px; border-top: 1px solid var(--rule); }
.hist svg { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

.hist-rail {
  position: relative; min-height: 0; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none;
  -webkit-mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent);
          mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent);
}
.hist-rail::-webkit-scrollbar { display: none; }
.hist-rail:focus-visible { outline: none; }
.hist-pad { height: calc(50% - 44px); }
.hist-item {
  width: 100%; display: grid; grid-template-columns: 14px 28px minmax(0, 1fr); align-items: start; gap: 12px; text-align: left;
  padding: 14px 8px; scroll-snap-align: center; position: relative; transition: opacity .15s;
}
.hist-item::before { content: ""; position: absolute; left: 14px; top: 0; bottom: 0; width: 1px; background: var(--rule); }
.hist-dot { width: 9px; height: 9px; margin: 6px 0 0 1px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--faint); position: relative; z-index: 1; }
.hist-ic { color: var(--muted); transition: transform .2s, color .2s; transform-origin: left center; }
.hist-ic svg { width: 20px; height: 20px; margin-top: 1px; }
.hist-txt { display: grid; gap: 2px; }
.hist-date { font: 500 14px/1.2 var(--sans); color: var(--faint); }
.hist-said { font: 600 clamp(16px, 1.5vw, 19px)/1.3 var(--sans); letter-spacing: -.015em; }
.hist-item[aria-selected="true"] .hist-dot { background: var(--ink); border-color: var(--ink); }
.hist-item[aria-selected="true"] .hist-ic { color: var(--ink); transform: scale(1.3); }
.hist-item[aria-selected="true"] .hist-date { color: var(--ink); }

/* Fit My History to the screen: title on top, the two panes fill the rest */
.history-page .statement { justify-items: start; text-align: left; gap: 6px; }
.history-page .statement h1 { font-size: clamp(28px, 3.4vh, 44px); }
html.fit .home.history-page { align-content: stretch !important; grid-template-rows: auto minmax(0, 1fr); padding-bottom: clamp(16px, 3vh, 32px); }
@media (orientation: portrait), (max-width: 899px) {
  .hist { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); gap: 16px; }
  .hist-focus { min-height: 0; padding: 8px 0 16px; }
}
@media (max-width: 699px), (max-height: 599px) {
  .hist-rail { height: 60vh; }
}

/* ── Section layouts: Cards, Grid, Tiles (List is the .notes style above) ── */
.cards { columns: 3; column-gap: 16px; }
.cardx { display: block; break-inside: avoid; margin-bottom: 18px; }
.cardx .body { border: 1px solid var(--rule); border-radius: 12px; background: var(--bg); padding: 18px; display: grid; gap: 12px; transition: transform .2s; }
@media (hover: hover) { .cardx:hover .body { transform: translateY(-2px); } }
.cardx .sw { height: 150px; border-radius: 8px; }
.cardx .quote { font: 600 20px/1.3 var(--sans); letter-spacing: -.02em; text-wrap: balance; }
.cardx.empty .body { border-style: dashed; min-height: 84px; place-content: center; color: var(--faint); font: 500 15px/1.3 var(--sans); }
.cardx .cap { margin: 6px 4px 0; font: 400 13px/1.3 var(--sans); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cardx .cap b { font-weight: 600; color: var(--muted); }

.gridx { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.cell { background: var(--bg); padding: 22px; min-height: 200px; display: grid; align-content: start; gap: 10px; }
@media (hover: hover) { .cell:hover { background: var(--hover); } }
.cell h3 { font: 700 19px/1.25 var(--sans); letter-spacing: -.015em; }
.cell p { font: 400 16px/1.5 var(--sans); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.cell.empty h3 { font-weight: 500; color: var(--faint); }
@media (hover: hover) { .blank:hover { background: var(--bg); } }
.gridx .fill2 { display: none; }
.tile { background: var(--bg); padding: clamp(20px, 2.6vw, 36px); min-height: 150px; display: flex; align-items: center; font: 500 clamp(20px, 2.5vh, 30px)/1.25 var(--sans); letter-spacing: -.015em; }
/* Tiles sit on a 6-column grid so a short last row can stretch instead of showing empty boxes */
.gridx.tiles6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.tiles6 .tile { grid-column: span 2; }
.tiles6 .last3-1 { grid-column: span 6; }
.tiles6 .last3-2 { grid-column: span 3; }
@media (orientation: portrait), (max-width: 899px) {
  .tiles6 .tile, .tiles6 .last3-1, .tiles6 .last3-2 { grid-column: span 3; }
  .tiles6 .last2-1 { grid-column: span 6; }
}

function noteGroups(c) {

  for (const [name, desc, entry] of partsFor(c)) {
    const key = `${c.id}/${name}`, w = entry ? when[key] || "Earlier" : null;
    const label = !entry ? "Nothing yet" : w.startsWith("Today") ? "Today" : w.startsWith("Yesterday") ? "Yesterday" : "Earlier";
    groups[label].push({ name, desc, entry });
  }
  return order.filter(k => groups[k].length).map(k => ({ label: k, rows: groups[k] }));
}

function topicsHTML(c, layout) {
  const label = `aria-label="Topics in ${esc(c.title)}"`;
  const rows = partsFor(c).map(([name, desc, entry]) => ({ name, desc, entry, when: entry ? when[`${c.id}/${name}`] || "" : "", color: visuals[`${c.id}/${name}`] }));
  // Empty cells that close off the last row: one set for the 3-column grid, one for the 2-column grid
  const blanks = (n, cls) => [[3, "fill3"], [2, "fill2"]].map(([cols, fill]) =>
    Array.from({ length: (cols - n % cols) % cols }, () => `<div class="${cls} blank ${fill}" aria-hidden="true"></div>`).join("")).join("");
  if (layout === "cards") {
    const ordered = [...rows.filter(r => r.entry), ...rows.filter(r => !r.entry)];
    return `<section class="cards" ${label}>${ordered.map(r => r.entry
      ? `<a class="cardx" href="#${c.id}" data-part="${esc(r.name)}"><div class="body">${r.color ? `<div class="sw" style="background:${r.color}"></div>` : ""}<p class="quote">${esc(r.entry)}</p></div>

let histSel = -1;
function showMoment(i) {
  if (i === histSel) return;
  histSel = i;
  const m = moments[i], card = $("#histFocus");
  card.classList.remove("in"); void card.offsetWidth;
  card.innerHTML = `<p class="hf-kind">${kindIcon(m.kind)}${kinds[m.kind].name}</p>
    <p class="hf-date">${m.date}</p>
    <p class="hf-said">“${esc(m.said)}”</p>

  card.classList.add("in");
  $("#histRail").querySelectorAll(".hist-item").forEach((el, j) => el.setAttribute("aria-selected", j === i));
}
function paintRail() {
  const rail = $("#histRail"); if (!rail) return;
  const box = rail.getBoundingClientRect(), mid = box.top + box.height / 2;
  let best = 0, bestD = Infinity;
  rail.querySelectorAll(".hist-item").forEach((el, j) => {
    const r = el.getBoundingClientRect(), d = Math.abs(r.top + r.height / 2 - mid);
    el.style.opacity = Math.max(0.08, 1 - d / (box.height * 0.42)).toFixed(3);   // fades the further it is from the middle
    if (d < bestD) { bestD = d; best = j; }
  });
  showMoment(best);
}
function initHistory() {
  histSel = -1;
  const rail = $("#histRail"); if (!rail) return;
  const items = rail.querySelectorAll(".hist-item");
  const center = (i, smooth) => items[i].scrollIntoView({ block: "center", behavior: smooth ? "smooth" : "auto" });
  let ticking = false;
  rail.addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { paintRail(); ticking = false; }); } }, { passive: true });
  items.forEach((el, i) => el.addEventListener("click", () => center(i, true)));
  rail.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); center(Math.min(items.length - 1, Math.max(0, histSel + (e.key === "ArrowDown" ? 1 : -1))), true); }
  });
  center(items.length - 1, false);   // start at now; scroll up to go back in time
  paintRail();
}

/* ── Sections and Trash ────────────────────────────────────
   Sections are curated: their order, names and definitions are fixed by the app,
   so no part of someone ranks above another. People can only hide a section and
   show it again; hiding never touches its entries. Deleting an entry moves it to
   Trash for 7 days, then it's gone for good. */
const TRASH_DAYS = 7, DAY = 86400000;
function store(key, fallback) { try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch (e) { return fallback; } }
function keep(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
const hiddenOf = id => store("about-me-hidden", {})[id] || [];
function setHidden(id, name, hide) {
  const all = store("about-me-hidden", {}), set = new Set(all[id] || []);
  hide ? set.add(name) : set.delete(name);
  all[id] = [...set]; keep("about-me-hidden", all);
}
function purgeTrash() {   // anything past 7 days is permanently deleted
  const now = Date.now(), trash = store("about-me-trash", []), purged = new Set(store("about-me-purged", []));
  const live = trash.filter(t => now - t.deletedAt < TRASH_DAYS * DAY || (purged.add(t.key), false));
  keep("about-me-trash", live); keep("about-me-purged", [...purged]);
  return live;
}
function isGone(key) { return store("about-me-trash", []).some(t => t.key === key) || store("about-me-purged", []).includes(key); }
function partsFor(c) {
  const hid = new Set(hiddenOf(c.id));
  return c.parts.filter(p => !hid.has(p[0])).map(([n, d, e]) => [n, d, e && !isGone(`${c.id}/${n}`) ? e : null]);
}
function timeLeft(t) {
  const ms = t.deletedAt + TRASH_DAYS * DAY - Date.now();
  const d = Math.ceil(ms / DAY), h = Math.ceil(ms / 3600000), m = Math.max(1, Math.ceil(ms / 60000));
  return ms > DAY ? `${d} days left` : ms > 3600000 ? `${h} hour${h > 1 ? "s" : ""} left` : `${m} minute${m > 1 ? "s" : ""} left`;
}
function openSheet(id) { closeAll(); $(id).hidden = false; $("#scrim").classList.add("open"); }
function closeSheets() { ["#entrySheet", "#sectionsSheet", "#trashSheet"].forEach(s => $(s).hidden = true); }

// Tapping a section opens its entry, with Delete (to Trash) and Hide this section
function openEntry(c, name) {
  const part = c.parts.find(p => p[0] === name); if (!part) return;
  const key = `${c.id}/${name}`, entry = part[2] && !isGone(key) ? part[2] : null;
  $("#entrySheet").innerHTML = `<div class="as-head"><div><p class="meta">${esc(c.title)}</p><h2>${esc(name)}</h2></div>
      <button type="button" class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    ${part[1] ? `<p class="as-where">${esc(part[1])}</p>` : ""}
    ${entry ? `<div class="entry-card"><p class="meta">${esc(when[key] || "Earlier")}</p><p class="et">${esc(entry)}</p>
      <div class="btns"><button type="button" class="pill" data-delete>Delete</button></div></div>`
      : `<p class="as-empty">No entries yet. Writing entries comes next.</p>`}
    <p class="as-status" id="entryStatus" role="status"></p>
    <div class="sheet-foot"><button type="button" class="pill" data-hide>Hide this section</button>
      <span class="meta">Hiding keeps everything. Show it again from ⋯ → Sections.</span></div>`;
  openSheet("#entrySheet");
  $("#entrySheet").onclick = e => {
    if (e.target.closest("[data-close]")) return closeAll();
    if (e.target.closest("[data-delete]")) {
      const trash = purgeTrash(); trash.unshift({ key, chapter: c.id, chapterTitle: c.title, part: name, text: entry, when: when[key] || "", deletedAt: Date.now() });
      keep("about-me-trash", trash); render(); openEntry(c, name);
      $("#entryStatus").textContent = `Moved to Trash. You can restore it for ${TRASH_DAYS} days from the bin on the homepage.`;
    }
    if (e.target.closest("[data-hide]")) { setHidden(c.id, name, true); closeAll(); render(); }
  };
}

function openSections() {

  $("#sectionsSheet").innerHTML = `<div class="as-head"><h2>Sections</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <p class="as-where">Choose which sections of ${esc(c.title)} you see. Hidden sections keep all their entries. The order is set by the app so no part of you ranks above another.</p>
    <div class="switches">${c.parts.map(([n]) => `<label class="sw-row"><span>${esc(n)}</span>
      <input type="checkbox" role="switch" data-sec="${esc(n)}" ${hid.has(n) ? "" : "checked"}><i aria-hidden="true"></i></label>`).join("")}</div>`;
  openSheet("#sectionsSheet");
  $("#sectionsSheet").onclick = e => { if (e.target.closest("[data-close]")) closeAll(); };
  $("#sectionsSheet").onchange = e => { const i = e.target.closest("[data-sec]"); if (!i) return; setHidden(c.id, i.dataset.sec, !i.checked); render(); openSections(); };
}
$("#moreBtn").onclick = openSections;

// Trash, from the small bin on the homepage
function trashBadge() { const n = purgeTrash().length; $("#trashCount").textContent = n || ""; $("#trashCount").hidden = !n; }
function openTrash() {
  const items = purgeTrash();
  $("#trashSheet").innerHTML = `<div class="as-head"><h2>Trash</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <p class="as-where">Deleted entries stay here for ${TRASH_DAYS} days, then they’re deleted for good. Hidden sections never come here.</p>
    <div class="as-list">${items.length ? items.map(t => `<div class="trash-item" data-key="${esc(t.key)}">
      <div><p class="meta">${esc(t.chapterTitle)} › ${esc(t.part)}</p><p class="et">${esc(t.text)}</p><p class="left">${timeLeft(t)}</p></div>
      <button type="button" class="pill" data-restore>Restore</button></div>`).join("") : `<p class="as-empty">Trash is empty.</p>`}</div>`;
  openSheet("#trashSheet");
  $("#trashSheet").onclick = e => {
    if (e.target.closest("[data-close]")) return closeAll();
    const r = e.target.closest("[data-restore]"); if (!r) return;
    const key = r.closest("[data-key]").dataset.key;
    keep("about-me-trash", purgeTrash().filter(t => t.key !== key)); render(); openTrash();
  };
}
$("#trashBtn").onclick = openTrash;

/* Studio is the app's one look; only its colour changes */
const TINTS = [
  { id: "blue", name: "Blue", c1: "#1638C9", c2: "#7FA9F3" },
  { id: "violet", name: "Violet", c1: "#4B22C9", c2: "#C3A8FA" },
  { id: "ocean", name: "Ocean", c1: "#05608A", c2: "#7FD3F0" },
  { id: "emerald", name: "Emerald", c1: "#0A6B55", c2: "#7FDDBF" },
  { id: "rose", name: "Rose", c1: "#B01E5B", c2: "#F6A6C4" },
  { id: "sunset", name: "Sunset", c1: "#B83A14", c2: "#F8C25C" },
  { id: "graphite", name: "Graphite", c1: "#0B0B0F", c2: "#9CA1AE" },
];
function currentTint() { const t = store("about-me-tint", "blue"); return TINTS.some(x => x.id === t) ? t : "blue"; }
function applyTint(id) {
  const root = document.documentElement;
  root.dataset.look = "studio"; root.dataset.tint = id;
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.setAttribute("content", "#ffffff"));
}
function renderLooks() {
  const now = currentTint();
  $("#looks").innerHTML = `<span class="label">Color</span>` + TINTS.map(t => `<button type="button" class="look-opt" role="radio" aria-checked="${t.id === now}" data-tint="${t.id}">
    <span class="chip" style="--c1:${t.c1};--c2:${t.c2}"></span>${t.name}<span class="ck" aria-hidden="true">✓</span></button>`).join("");
}
$("#looks").onclick = e => { const b = e.target.closest(".look-opt[data-tint]"); if (!b) return; keep("about-me-tint", b.dataset.tint); applyTint(b.dataset.tint); renderLooks(); };
applyTint(currentTint());

/* ── Annotate ─────────────────────────────────────────────
   Draw over the current screen, explain the change, save it.
   In the Claude preview comments go to the artifact's private database,
   where Claude can read them. Elsewhere (the Home Screen app) they are
   kept on this device, with Share to send them on. */
const annot = { strokes: [], color: "#E5484D", drawing: null, shot: null };
let dbReady = null;   // the artifact database, when this view has it
let dbTried = false;
async function annotDB() {
  if (dbTried) return dbReady;
  dbTried = true;
  try { dbReady = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { dbReady = null; }
  return dbReady;
}
function sizeCanvas() {
  const c = $("#annotCanvas"), r = window.devicePixelRatio || 1;
  c.width = Math.round(innerWidth * r); c.height = Math.round(innerHeight * r);
  redraw();
}
function redraw() {
  const c = $("#annotCanvas"), ctx = c.getContext("2d"), r = c.width / innerWidth;
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const st of annot.strokes) {
    for (let i = 1; i < st.pts.length; i++) {
      const a = st.pts[i - 1], b = st.pts[i];
      ctx.strokeStyle = st.color; ctx.lineWidth = 2 + 4 * (b.p || .5);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    if (st.pts.length === 1) { const a = st.pts[0]; ctx.fillStyle = st.color; ctx.beginPath(); ctx.arc(a.x, a.y, 3, 0, 7); ctx.fill(); }
  }
}
function openAnnotate() {
  closeAll();
  annot.strokes = [];
  $("#annot").hidden = false;
  sizeCanvas();
}
function closeAnnotate() { $("#annot").hidden = true; $("#annotSheet").hidden = true; annot.strokes = []; }
$("#annotateBtn").onclick = openAnnotate;
addEventListener("resize", () => { if (!$("#annot").hidden) sizeCanvas(); });
(() => {
  const c = $("#annotCanvas");
  c.addEventListener("pointerdown", e => {
    c.setPointerCapture(e.pointerId);
    annot.drawing = { color: annot.color, pts: [{ x: e.clientX, y: e.clientY, p: e.pressure || .5 }] };
    annot.strokes.push(annot.drawing); redraw();
  });
  c.addEventListener("pointermove", e => {
    if (!annot.drawing) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of evs) annot.drawing.pts.push({ x: ev.clientX, y: ev.clientY, p: ev.pressure || .5 });
    redraw();
  });
  const end = () => { annot.drawing = null; };
  c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end);
})();
document.querySelectorAll(".swatch").forEach(b => b.onclick = () => {
  annot.color = b.dataset.color;
  document.querySelectorAll(".swatch").forEach(x => x.classList.toggle("on", x === b));
});
$("#annotUndo").onclick = () => { annot.strokes.pop(); redraw(); };
$("#annotClear").onclick = () => { annot.strokes = []; redraw(); };
$("#annotCancel").onclick = closeAnnotate;

function loadHtml2canvas() {
  if (window.html2canvas) return Promise.resolve(window.html2canvas);
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    s.onload = () => ok(window.html2canvas); s.onerror = fail;
    document.head.appendChild(s);
  });
}
// The screen as it looks right now, with the drawing on top, as a small JPEG
async function captureScreen() {
  const w = innerWidth, h = innerHeight, scale = Math.min(1, 900 / w);
  const out = document.createElement("canvas");
  out.width = Math.round(w * scale); out.height = Math.round(h * scale);
  const ctx = out.getContext("2d");
  ctx.fillStyle = getComputedStyle(document.body).backgroundColor || "#fff"; ctx.fillRect(0, 0, out.width, out.height);
  try {
    const h2c = await loadHtml2canvas();
    const page = await h2c(document.body, { x: scrollX, y: scrollY, width: w, height: h, windowWidth: w, windowHeight: h, scale, useCORS: true, logging: false,
      backgroundColor: null,
      // the screenshot library can't read color-mix(); give the copy solid backgrounds instead
      onclone: doc => { const st = doc.createElement("style"); st.textContent = ".topbar{background:var(--bg)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}*{animation:none!important;transition:none!important}"; doc.head.appendChild(st); } });
    ctx.drawImage(page, 0, 0, out.width, out.height);
  } catch (e) { /* no screenshot: the drawing alone still says a lot */ }
  ctx.drawImage($("#annotCanvas"), 0, 0, out.width, out.height);
  let q = .72, url = out.toDataURL("image/jpeg", q);
  while (url.length > 180000 && q > .3) { q -= .12; url = out.toDataURL("image/jpeg", q); }
  return url;
}
function pageName() {
  const raw = location.hash.slice(1) || "home", c = chapters.find(x => x.id === raw);
  return c ? c.title : raw === "now" ? "Right Now" : "Home";
}
$("#annotDone").onclick = async () => {
  $("#annotDone").disabled = true; $("#annotDone").textContent = "…";
  annot.shot = await captureScreen();
  $("#annotDone").disabled = false; $("#annotDone").textContent = "Done";
  $("#asPreview").src = annot.shot;
  $("#asStatus").textContent = "";
  $("#annotSheet").hidden = false;
  setTimeout(() => $("#asNote").focus(), 50);
};
$("#asBack").onclick = $("#asClose").onclick = () => { $("#annotSheet").hidden = true; };

const LOCAL_KEY = "about-me-annotations";
function localList() { try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); } catch (e) { return []; } }
function localSave(list) { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(list)); return true; } catch (e) { return false; } }

$("#asSave").onclick = async () => {
  const note = $("#asNote").value.trim();
  if (!note && !annot.strokes.length) { $("#asStatus").textContent = "Draw something or write a note first."; return; }
  const item = {
    page: location.hash.slice(1) || "home", pageName: pageName(), note, image: annot.shot,
    orientation: innerWidth > innerHeight ? "landscape" : "portrait", size: `${innerWidth}×${innerHeight}`,
    layout: (() => { const c = chapters.find(x => x.id === location.hash.slice(1)); return c ? getLayout(c.id) : null; })(),
    createdAt: new Date().toISOString(),
  };
  $("#asSave").disabled = true; $("#asStatus").textContent = "Saving…";
  const db = await annotDB();
  let saved = false, where = "";
  if (db) {
    try { await db.collection("annotations").doc("a" + Date.now()).set(item); saved = true; where = "Saved. Claude can read it now."; }
    catch (e) { where = ""; }
  }
  if (!saved) {
    const list = localList(); list.unshift({ id: "a" + Date.now(), ...item });
    saved = localSave(list.slice(0, 40));
    where = saved ? "Saved on this iPad. Open Saved and tap Share to send it to Claude." : "";
  }
  $("#asSave").disabled = false;
  if (!saved) { $("#asStatus").textContent = "Couldn’t save. Your note is still here; try again in a moment."; return; }
  $("#asStatus").textContent = where;
  $("#asNote").value = "";
  setTimeout(() => { closeAnnotate(); }, 1400);
};

async function listSaved() {
  const db = await annotDB();
  if (db) {
    try {
      const snap = await db.collection("annotations").orderBy("createdAt", "desc").limit(50).get();
      return { where: "db", items: snap.docs.map(d => ({ id: d.id, ...d.data() })) };
    } catch (e) { /* fall back to this device */ }
  }
  return { where: "local", items: localList() };
}
async function showSaved() {
  $("#savedSheet").hidden = false;
  $("#ssList").innerHTML = `<p class="as-empty">Loading…</p>`;
  const { where, items } = await listSaved();
  $("#ssWhere").textContent = where === "db" ? "Saved to this preview. Claude can read these." : "Saved on this iPad. Tap Share to send one to Claude.";
  $("#ssList").innerHTML = items.length ? items.map(it => `<div class="as-item" data-id="${esc(it.id)}">
      ${it.image ? `<img src="${it.image}" alt="Drawing on ${esc(it.pageName)}">` : "<span></span>"}
      <div><p class="meta">${esc(it.pageName)} · ${new Date(it.createdAt).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}</p>
        <p class="n">${esc(it.note || "(no note)")}</p>
        <div class="btns">${where === "local" && navigator.share ? `<button type="button" data-act="share">Share</button>` : ""}<button type="button" data-act="delete">Delete</button></div></div>
    </div>`).join("") : `<p class="as-empty">No saved comments yet.</p>`;
  $("#ssList").onclick = async e => {
    const btn = e.target.closest("[data-act]"); if (!btn) return;
    const id = btn.closest(".as-item").dataset.id, it = items.find(x => x.id === id);
    if (btn.dataset.act === "delete") {
      if (where === "db") { try { await (await annotDB()).collection("annotations").doc(id).delete(); } catch (err) {} }
      else localSave(localList().filter(x => x.id !== id));
      showSaved();
    }
    if (btn.dataset.act === "share") {
      const text = `About Me feedback — ${it.pageName} (${it.orientation}, ${it.size}):\n${it.note}`;
      try {
        const blob = await (await fetch(it.image)).blob();
        const file = new File([blob], `about-me-${it.page}.jpg`, { type: "image/jpeg" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], text });
        else await navigator.share({ text });
      } catch (err) { /* share sheet closed */ }
    }
  };
}
$("#annotSaved").onclick = showSaved;
$("#ssClose").onclick = () => { $("#savedSheet").hidden = true; };

addEventListener("hashchange", render);
render();
</script>
