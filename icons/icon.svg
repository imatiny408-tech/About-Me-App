<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- About Me app icon: an Apple-style folder filling the whole square, with a person and a spark
       stamped into the front, the way macOS shows symbols on folders.
       Full-bleed square: iOS and iPadOS round the corners themselves. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E6FC9"/><stop offset="1" stop-color="#3A82DD"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5DA8F2"/><stop offset="1" stop-color="#3E8DE8"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9EEF5"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8CCBFF"/><stop offset=".55" stop-color="#6DB6FA"/><stop offset="1" stop-color="#58A6F4"/>
    </linearGradient>
    <linearGradient id="stamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3F8FE3"/><stop offset="1" stop-color="#3A86DA"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1B3F73" flood-opacity=".22"/>
    </filter>
    <filter id="flap" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-4" stdDeviation="6" flood-color="#1E5FB0" flood-opacity=".25"/>
    </filter>
    <!-- the symbol: a person and a spark -->
    <g id="glyph">
      <circle cx="512" cy="540" r="74"/>
      <path d="M512 640 C604 640 668 690 680 760 C684 784 670 800 646 800 H378 C354 800 340 784 344 760 C356 690 420 640 512 640 Z"/>
      <path d="M676 478 C680 506 688 514 716 518 C688 522 680 530 676 558 C672 530 664 522 636 518 C664 514 672 506 676 478 Z"/>
    </g>
  </defs>

  <!-- the folder fills the whole square: deeper blue behind the tab, the folder in front -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g filter="url(#drop)">
    <!-- back of the folder, tab on the top left -->
    <path d="M0 160 H60 V112 C60 86 80 66 106 66 H404 C434 66 450 76 466 98 L494 138 C504 152 516 160 540 160 H1024 V1024 H0 Z" fill="url(#back)"/>
    <!-- a sheet of paper peeking out -->
    <rect x="64" y="196" width="896" height="600" rx="32" fill="url(#paper)"/>
    <!-- front flap, running off the sides and bottom -->
    <path d="M24 318 C24 282 52 254 88 254 H936 C972 254 1000 282 1000 318 V1060 H24 Z" fill="url(#front)" filter="url(#flap)"/>
    <!-- a hairline of light along the flap's top edge -->
    <path d="M88 256 H936 C968 256 996 280 998 314" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="3"/>
  </g>

  <!-- stamped symbol: a light edge below, the darker fill on top -->
  <g transform="translate(512 648) scale(1.02) translate(-512 -638)">
    <use href="#glyph" fill="#FFFFFF" fill-opacity=".45" transform="translate(0 5)"/>
    <use href="#glyph" fill="url(#stamp)"/>
  </g>
</svg>
